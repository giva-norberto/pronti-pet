<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Pagamento de Assinatura - Pronti Pet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #4f46e5 0%, #222664 100%);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
      box-sizing: border-box;
      color: #ffffff;
    }

    .container-pagamento {
      background: transparent;
      text-align: center;
      width: 100%;
      max-width: 600px;
    }

    h1 {
      color: #ffffff;
      font-size: clamp(2rem, 5vw, 2.8rem);
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
      margin-bottom: 25px;
    }

    #info-status-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      background-color: rgba(0, 0, 0, 0.15);
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-wrap: wrap;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(0.9rem, 2vw, 1rem);
      color: #e0e7ff;
      font-weight: 600;
    }

    .info-item i {
      font-size: 1.2rem;
      color: #a5b4fc;
    }

    .lista-planos {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 32px;
    }

    .card-plano {
      background: linear-gradient(135deg, #6366f1, #4facfe);
      color: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      text-align: left;
      border: 2px solid #38f9d7;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .card-plano .titulo {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0;
    }

    .card-plano .descricao {
      margin: 8px 0 0;
      color: rgba(255,255,255,0.88);
      font-size: 0.95rem;
    }

    .card-plano .preco {
      font-size: 2.2rem;
      font-weight: 700;
      margin: 14px 0 4px;
    }

    .card-plano .preco span {
      font-size: 1rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.75);
    }

    .btn-pagar-opcao {
      width: 100%;
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 18px 0;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      box-sizing: border-box;
    }

    .btn-pagar-opcao:hover {
      transform: translateY(-2px);
    }

    .btn-pagar-opcao.mercadopago {
      background: #009ee3;
      box-shadow: 0 4px 15px rgba(0, 158, 227, 0.3);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-content {
      background: #fff;
      color: #333;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .btn-cancelar {
      background: none;
      border: none;
      color: #666;
      margin-top: 15px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container-pagamento">
    <h1>Pronti Pet</h1>

    <div id="info-status-container">
      <div class="info-item">
        <i class="fa-solid fa-file-invoice"></i>
        <span id="info-plano-atual">Carregando plano...</span>
      </div>
      <div class="info-item">
        <i class="fa-solid fa-users"></i>
        <span id="info-equipe-atual">Carregando equipe...</span>
      </div>
    </div>

    <div class="lista-planos">
      <div class="card-plano">
        <h3 class="titulo">Pronti Pet - Plano Único</h3>
        <p class="descricao">Acesso completo ao Pronti Pet.</p>
        <p class="preco">R$ 79,90<span>/mês</span></p>
      </div>
    </div>

    <button id="btn-pagar-mp" class="btn-pagar-opcao mercadopago">
      <i class="fa-solid fa-credit-card"></i> Assinar com Mercado Pago
    </button>
  </div>

  <div id="mp-modal" class="modal-overlay">
    <div class="modal-content">
      <h2>Assinar com Mercado Pago</h2>
      <p>Abra a página segura do Mercado Pago para concluir a assinatura mensal do Pronti Pet.</p>
      <a href="https://mpago.la/1dgpefG" id="btn-abrir-link-mp" target="_blank" rel="noopener" class="btn-pagar-opcao mercadopago" style="margin-top:20px;">
        <i class="fa-solid fa-external-link-alt"></i> Abrir Mercado Pago
      </a>
      <button id="btn-fechar-mp-modal" class="btn-cancelar">Cancelar</button>
    </div>
  </div>

  <script type="module" src="./firebase-config.js"></script>

  <script type="module">
    import { db } from './firebase-config.js';
    import { doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    const LINK_MERCADO_PAGO = "https://mpago.la/1dgpefG";
    const infoPlanoAtual = document.getElementById("info-plano-atual");
    const infoEquipeAtual = document.getElementById("info-equipe-atual");

    async function buscarDadosEmpresa(empresaId) {
      if (!empresaId) {
        infoPlanoAtual.textContent = "Plano: Não identificado";
        infoEquipeAtual.textContent = "Equipe: Não identificada";
        return;
      }

      try {
        const empresaRef = doc(db, "empresarios", empresaId);
        const profissionaisRef = collection(db, "empresarios", empresaId, "profissionais");
        const [empresaSnap, profissionaisSnap] = await Promise.all([
          getDoc(empresaRef),
          getDocs(profissionaisRef)
        ]);

        if (empresaSnap.exists()) {
          const empresaData = empresaSnap.data();
          const planoAtualRaw = empresaData.plano || "free";
          const planoAtual = planoAtualRaw.charAt(0).toUpperCase() + planoAtualRaw.slice(1);
          const equipe = profissionaisSnap.size;
          infoPlanoAtual.textContent = `Plano Atual: ${planoAtual}`;
          infoEquipeAtual.textContent = `Equipe: ${equipe} Membro${equipe !== 1 ? 's' : ''}`;
        } else {
          infoPlanoAtual.textContent = "Plano: Empresa não encontrada";
          infoEquipeAtual.textContent = "Equipe: Não identificada";
        }
      } catch (error) {
        console.error("Erro ao buscar dados da empresa:", error);
        infoPlanoAtual.textContent = "Plano: Erro ao carregar";
        infoEquipeAtual.textContent = "Equipe: Erro ao carregar";
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const empresaId = urlParams.get("empresaId");
      await buscarDadosEmpresa(empresaId);

      document.getElementById('btn-pagar-mp').addEventListener('click', () => {
        document.getElementById('btn-abrir-link-mp').href = LINK_MERCADO_PAGO;
        document.getElementById('mp-modal').style.display = 'flex';
      });

      document.getElementById('btn-fechar-mp-modal').addEventListener('click', () => {
        document.getElementById('mp-modal').style.display = 'none';
      });
    });
  </script>
</body>
</html>
