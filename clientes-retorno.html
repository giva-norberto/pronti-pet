<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientes para Retorno</title>

  <link rel="stylesheet" href="menu-principal.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --pet-roxo: #5522b6;
      --pet-roxo-2: #7140dc;
      --pet-roxo-escuro: #201042;
      --pet-amarelo: #ffc928;
      --pet-fundo: #f8f5ff;
      --pet-card: #ffffff;
      --pet-borda: #e7def8;
      --pet-texto: #17113d;
      --pet-muted: #726b86;
      --pet-verde: #16a34a;
      --pet-azul: #2563eb;
      --pet-vermelho: #dc2626;
      --pet-laranja: #ea7b12;
      --shadow: 0 14px 34px rgba(32, 16, 66, .08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: 'Poppins', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      color: var(--pet-texto);
      background:
        radial-gradient(circle at 84% 4%, rgba(255, 201, 40, .13), transparent 22rem),
        radial-gradient(circle at 50% 7%, rgba(113, 64, 220, .11), transparent 24rem),
        linear-gradient(180deg, #fbfaff 0%, var(--pet-fundo) 100%);
    }

    .pagina {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px 24px 60px;
    }

    .topo {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      margin-bottom: 16px;
      padding: 18px 20px;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(255,255,255,.98), rgba(248,244,255,.98));
      border: 1px solid var(--pet-borda);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .topo::after {
      content: "🐾";
      position: absolute;
      right: 100px;
      bottom: -20px;
      font-size: 4rem;
      opacity: .05;
      transform: rotate(-18deg);
      pointer-events: none;
    }

    .titulo-box {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .titulo-box h1 {
      margin: 0;
      color: var(--pet-roxo-escuro);
      font-size: clamp(1.45rem, 2.4vw, 2rem);
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -.035em;
    }

    .titulo-box h1::before {
      content: "\f2bd";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      display: inline-grid;
      place-items: center;
      width: 44px;
      height: 44px;
      margin-right: 12px;
      border-radius: 14px;
      vertical-align: middle;
      color: var(--pet-roxo);
      background: #f1eaff;
      box-shadow: inset 0 0 0 1px #dfd2fb;
    }

    .titulo-box p {
      margin: 0 0 0 58px;
      max-width: 720px;
      color: var(--pet-muted);
      font-size: .78rem;
      line-height: 1.5;
      font-weight: 500;
    }

    .btn-voltar {
      position: relative;
      z-index: 2;
      min-height: 40px;
      padding: 9px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--pet-roxo);
      background: #fff;
      border: 1px solid var(--pet-borda);
      border-radius: 12px;
      box-shadow: 0 7px 18px rgba(32, 16, 66, .05);
      font-size: .72rem;
      font-weight: 800;
      text-decoration: none;
      transition: transform .18s ease, background .18s ease;
    }

    .btn-voltar:hover,
    .btn-voltar:active {
      transform: translateY(-1px);
      background: #f7f2ff;
    }

    .painel {
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid var(--pet-borda);
      border-radius: 20px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 12px 30px rgba(32, 16, 66, .07);
    }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid #eee8f8;
    }

    .filtro-btn {
      min-height: 36px;
      padding: 8px 12px;
      cursor: pointer;
      color: var(--pet-roxo);
      background: #f5f0ff;
      border: 1px solid #e1d6fb;
      border-radius: 999px;
      font: 800 .66rem 'Poppins', sans-serif;
      transition: transform .18s ease, background .18s ease, color .18s ease;
    }

    .filtro-btn:hover,
    .filtro-btn:active {
      transform: translateY(-1px);
      background: #eee6ff;
    }

    .filtro-btn.ativo {
      color: #fff;
      background: linear-gradient(135deg, var(--pet-roxo), var(--pet-roxo-2));
      border-color: transparent;
      box-shadow: 0 8px 18px rgba(85, 34, 182, .18);
    }

    .resumo {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .card-resumo {
      min-height: 100px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 1px solid var(--pet-borda);
      border-top: 4px solid var(--pet-roxo);
      border-radius: 16px;
      background: linear-gradient(180deg, #f8f3ff 0%, #ffffff 100%);
    }

    .card-resumo:nth-child(2) {
      border-top-color: var(--pet-vermelho);
      background: linear-gradient(180deg, #fff2f2 0%, #ffffff 100%);
    }

    .card-resumo:nth-child(3) {
      border-top-color: var(--pet-amarelo);
      background: linear-gradient(180deg, #fff9e8 0%, #ffffff 100%);
    }

    .card-resumo:nth-child(4) {
      border-top-color: var(--pet-azul);
      background: linear-gradient(180deg, #f1f6ff 0%, #ffffff 100%);
    }

    .card-resumo .rotulo {
      margin-bottom: 5px;
      color: var(--pet-muted);
      font-size: .67rem;
      line-height: 1.3;
      font-weight: 700;
    }

    .card-resumo .valor {
      color: var(--pet-roxo-escuro);
      font-size: 1.45rem;
      line-height: 1;
      font-weight: 900;
    }

    .lista {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .cliente-card {
      min-width: 0;
      padding: 15px;
      display: grid;
      gap: 11px;
      color: var(--pet-texto);
      background: #fff;
      border: 1px solid var(--pet-borda);
      border-top: 4px solid var(--pet-roxo);
      border-radius: 17px;
      box-shadow: 0 9px 22px rgba(32, 16, 66, .055);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .cliente-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(32, 16, 66, .09);
    }

    .cliente-topo {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .cliente-info {
      display: flex;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    .cliente-foto {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      object-fit: cover;
      border: 3px solid #f1eaff;
      border-radius: 50%;
      background: #eee9f8;
    }

    .cliente-nome {
      margin: 0;
      overflow: hidden;
      color: var(--pet-roxo-escuro);
      font-size: .9rem;
      line-height: 1.25;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cliente-sub {
      margin: 2px 0 0;
      overflow-wrap: anywhere;
      color: var(--pet-muted);
      font-size: .65rem;
      line-height: 1.35;
      font-weight: 500;
    }

    .badge-status {
      padding: 6px 9px;
      border-radius: 999px;
      font-size: .58rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .status-atrasado { background: #fee2e2; color: #b91c1c; }
    .status-hoje { background: #fef3c7; color: #b45309; }
    .status-em_breve { background: #dbeafe; color: #1d4ed8; }
    .status-futuro { background: #e5e7eb; color: #374151; }
    .status-sem_historico { background: #ede9fe; color: #6d28d9; }

    .cliente-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
    }

    .info-box {
      min-width: 0;
      padding: 10px;
      border: 1px solid #eee8f8;
      border-radius: 12px;
      background: #fbf9ff;
    }

    .info-box .label {
      margin-bottom: 4px;
      color: var(--pet-muted);
      font-size: .55rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      font-weight: 800;
    }

    .info-box .texto {
      color: var(--pet-texto);
      font-size: .68rem;
      line-height: 1.35;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .vazio {
      padding: 28px 18px;
      text-align: center;
      color: var(--pet-muted);
      background: #fbf9ff;
      border: 1px dashed #d9ccfb;
      border-radius: 16px;
      font-size: .76rem;
      font-weight: 700;
    }

    .loading {
      padding: 30px 12px;
      text-align: center;
      color: var(--pet-roxo);
      background: #fbf9ff;
      border: 1px dashed #d9ccfb;
      border-radius: 16px;
      font-size: .76rem;
      font-weight: 800;
    }

    .loading::before {
      content: "";
      width: 22px;
      height: 22px;
      margin-right: 9px;
      display: inline-block;
      vertical-align: middle;
      border: 3px solid rgba(85, 34, 182, .16);
      border-top-color: var(--pet-roxo);
      border-radius: 50%;
      animation: spin .85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 760px) {
      .pagina {
        padding: 12px 10px 45px;
      }

      .topo {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 9px;
        margin-bottom: 10px;
        padding: 12px;
        border-radius: 16px;
      }

      .titulo-box h1 {
        font-size: 1rem;
        white-space: nowrap;
      }

      .titulo-box h1::before {
        width: 36px;
        height: 36px;
        margin-right: 8px;
        border-radius: 11px;
        font-size: .8rem;
      }

      .titulo-box p {
        display: none;
      }

      .btn-voltar {
        width: 38px;
        min-height: 36px;
        padding: 0;
        font-size: 0;
      }

      .btn-voltar i {
        font-size: .72rem;
      }

      .painel {
        padding: 10px;
        border-radius: 16px;
      }

      .filtros {
        flex-wrap: nowrap;
        gap: 6px;
        margin-bottom: 10px;
        padding-bottom: 10px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .filtros::-webkit-scrollbar {
        display: none;
      }

      .filtro-btn {
        min-height: 32px;
        padding: 7px 10px;
        flex: 0 0 auto;
        font-size: .56rem;
      }

      .resumo {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        margin-bottom: 10px;
      }

      .card-resumo {
        min-height: 78px;
        padding: 8px 6px;
        border-radius: 12px;
      }

      .card-resumo .rotulo {
        font-size: .48rem;
      }

      .card-resumo .valor {
        font-size: 1rem;
      }

      .lista {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .cliente-card {
        padding: 11px;
        gap: 8px;
        border-radius: 14px;
      }

      .cliente-foto {
        width: 42px;
        height: 42px;
      }

      .cliente-nome {
        font-size: .75rem;
      }

      .cliente-sub {
        font-size: .55rem;
      }

      .badge-status {
        padding: 5px 7px;
        font-size: .5rem;
      }

      .cliente-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .info-box {
        padding: 8px;
        border-radius: 10px;
      }

      .info-box .label {
        font-size: .47rem;
      }

      .info-box .texto {
        font-size: .58rem;
      }
    }

    @media (max-width: 390px) {
      .pagina {
        padding-left: 8px;
        padding-right: 8px;
      }

      .card-resumo .rotulo {
        font-size: .44rem;
      }

      .card-resumo .valor {
        font-size: .9rem;
      }
    }
  </style>
</head>
<body>
  <div class="pagina">
    <div class="topo">
      <div class="titulo-box">
        <h1>Clientes para Retorno</h1>
        <p>Baseado na média dos últimos atendimentos realizados de cada cliente.</p>
      </div>

      <a href="clientes.html" class="btn-voltar" aria-label="Voltar para Clientes">
        <i class="fa-solid fa-arrow-left"></i>
        Voltar
      </a>
    </div>

    <div class="painel">
      <div class="filtros" id="filtros-retorno">
        <button class="filtro-btn ativo" data-filtro="todos">Todos</button>
        <button class="filtro-btn" data-filtro="atrasado">Atrasados</button>
        <button class="filtro-btn" data-filtro="hoje">Hoje</button>
        <button class="filtro-btn" data-filtro="em_breve">Em breve</button>
        <button class="filtro-btn" data-filtro="futuro">Futuro</button>
        <button class="filtro-btn" data-filtro="sem_historico">Sem histórico</button>
      </div>

      <div class="resumo" id="cards-resumo">
        <div class="card-resumo">
          <div class="rotulo">Total analisado</div>
          <div class="valor" id="resumo-total">0</div>
        </div>
        <div class="card-resumo">
          <div class="rotulo">Atrasados</div>
          <div class="valor" id="resumo-atrasados">0</div>
        </div>
        <div class="card-resumo">
          <div class="rotulo">Hoje</div>
          <div class="valor" id="resumo-hoje">0</div>
        </div>
        <div class="card-resumo">
          <div class="rotulo">Em breve</div>
          <div class="valor" id="resumo-em-breve">0</div>
        </div>
      </div>

      <div id="estado-loading" class="loading">Carregando clientes para retorno...</div>
      <div id="lista-retorno" class="lista" style="display:none;"></div>
      <div id="estado-vazio" class="vazio" style="display:none;">
        Nenhum cliente encontrado para o filtro selecionado.
      </div>
    </div>
  </div>

  <script type="module" src="./clientes-retorno.js"></script>
</body>
</html>
