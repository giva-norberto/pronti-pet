<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Planos - Pronti Pet</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:400,600,700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Inclua o CSS global da Pronti -->
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --pet-roxo: #5522b6;
            --pet-roxo-2: #7140dc;
            --pet-roxo-escuro: #201042;
            --pet-amarelo: #ffc928;
            --pet-fundo: #f8f5ff;
            --pet-card: #ffffff;
            --pet-borda: #e7def8;
            --pet-texto: #17113d;
            --pet-muted: #726b86;
            --pet-verde: #16a34a;
            --pet-azul: #2563eb;
            --pet-laranja: #ea7b12;
            --sidebar-width: 250px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            font-family: 'Poppins', sans-serif;
            color: var(--pet-texto);
            background:
                radial-gradient(circle at 88% 4%, rgba(255, 201, 40, .14), transparent 22rem),
                radial-gradient(circle at 22% 88%, rgba(113, 64, 220, .10), transparent 24rem),
                linear-gradient(180deg, #fbfaff 0%, var(--pet-fundo) 100%);
        }

        #menu-container {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            flex-shrink: 0;
        }

        main {
            flex: 1;
            min-width: 0;
            min-height: 100vh;
            padding: 28px 30px 80px;
        }

        .pagina-shell {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
        }

        .header-pagina {
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            margin-bottom: 22px;
            padding: 22px 24px;
            border: 1px solid var(--pet-borda);
            border-radius: 22px;
            background:
                radial-gradient(circle at 90% 20%, rgba(255,201,40,.18), transparent 10rem),
                linear-gradient(135deg, #ffffff 0%, #f8f3ff 100%);
            box-shadow: 0 16px 38px rgba(32, 16, 66, .08);
        }

        .header-pagina::after {
            content: "🐾";
            position: absolute;
            right: 22px;
            bottom: -22px;
            font-size: 5rem;
            opacity: .05;
            transform: rotate(-18deg);
            pointer-events: none;
        }

        .header-titulo {
            position: relative;
            z-index: 1;
        }

        .header-titulo h1 {
            margin: 0 0 5px;
            color: var(--pet-roxo-escuro);
            font-size: clamp(1.55rem, 3vw, 2.25rem);
            line-height: 1.08;
            letter-spacing: -.04em;
        }

        .header-titulo p {
            margin: 0;
            color: var(--pet-muted);
            font-size: .88rem;
            line-height: 1.5;
        }

        .header-botoes {
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-header {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 15px;
            border: 0;
            border-radius: 12px;
            color: #fff;
            font: 800 .78rem 'Poppins', sans-serif;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(32, 16, 66, .10);
            transition: transform .18s ease, box-shadow .18s ease;
        }

        .btn-header:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(32, 16, 66, .16);
        }

        .btn-assinantes {
            background: linear-gradient(135deg, #5522b6, #7140dc);
        }

        .btn-dashboard {
            background: linear-gradient(135deg, #d99b00, #f4b820);
            color: #2b1558;
        }

        .btn-novo {
            background: linear-gradient(135deg, #16a34a, #22c55e);
        }

        .secao-planos {
            padding: 20px;
            border: 1px solid var(--pet-borda);
            border-radius: 22px;
            background: rgba(255,255,255,.74);
            box-shadow: 0 14px 34px rgba(32,16,66,.055);
            backdrop-filter: blur(6px);
        }

        .secao-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .secao-cabecalho h2 {
            margin: 0;
            color: var(--pet-roxo-escuro);
            font-size: 1.05rem;
        }

        .secao-cabecalho span {
            color: var(--pet-muted);
            font-size: .75rem;
            font-weight: 600;
        }

        #lista-de-planos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 18px;
        }

        .card-plano-item {
            position: relative;
            overflow: hidden;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 22px;
            border: 1px solid var(--pet-borda);
            border-top: 5px solid var(--pet-roxo);
            border-radius: 18px;
            background:
                radial-gradient(circle at 100% 0%, rgba(255,201,40,.10), transparent 9rem),
                linear-gradient(180deg, #ffffff 0%, #fbf9ff 100%);
            color: var(--pet-texto);
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(32,16,66,.065);
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
        }

        .card-plano-item::after {
            content: "\f061";
            position: absolute;
            right: 18px;
            bottom: 16px;
            color: var(--pet-roxo);
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            font-size: .8rem;
        }

        .card-plano-item:hover {
            transform: translateY(-4px);
            border-color: #d7c7ff;
            box-shadow: 0 18px 34px rgba(32,16,66,.11);
        }

        .card-plano-item h3 {
            margin: 0 0 8px;
            padding-right: 28px;
            color: var(--pet-roxo-escuro);
            font-size: 1.12rem;
            line-height: 1.3;
        }

        .card-plano-item .preco {
            margin: 0 0 14px;
            color: var(--pet-verde);
            font-size: 1.42rem;
            font-weight: 900;
        }

        .metodo {
            width: fit-content;
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            color: #fff;
            font-size: .66rem;
            font-weight: 900;
            letter-spacing: .02em;
            text-transform: uppercase;
        }

        .metodo-automatico {
            background: linear-gradient(135deg, #2563eb, #4f83f1);
        }

        .metodo-manual {
            background: linear-gradient(135deg, #d99b00, #f2b91d);
            color: #2b1558;
        }

        .erro {
            grid-column: 1 / -1;
            margin: 0;
            padding: 15px;
            border: 1px solid #fecaca;
            border-radius: 13px;
            background: #fef2f2;
            color: #b91c1c;
            font-weight: 700;
        }

        .info {
            grid-column: 1 / -1;
            margin: 0;
            padding: 26px;
            color: var(--pet-muted);
            font-weight: 700;
            text-align: center;
        }

        .card-plano-vazio {
            grid-column: 1 / -1;
            width: min(100%, 480px);
            min-height: 310px;
            margin: 14px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
            border: 1px solid var(--pet-borda);
            border-top: 5px solid var(--pet-amarelo);
            border-radius: 22px;
            background:
                radial-gradient(circle at 50% 0%, rgba(255,201,40,.13), transparent 11rem),
                #fff;
            color: var(--pet-texto);
            text-align: center;
            box-shadow: 0 14px 34px rgba(32,16,66,.08);
        }

        .card-vazio-content i {
            display: block;
            margin-bottom: 16px;
            color: var(--pet-amarelo);
            font-size: 2.8rem;
            filter: drop-shadow(0 7px 12px rgba(32,16,66,.12));
        }

        .card-vazio-content h2 {
            margin: 0 0 10px;
            color: var(--pet-roxo-escuro);
            font-size: 1.2rem;
        }

        .card-vazio-content p {
            margin: 0 0 22px;
            color: var(--pet-muted);
            font-size: .9rem;
            line-height: 1.5;
        }

        .btn-novo-card {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 18px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--pet-roxo), var(--pet-roxo-2));
            color: #fff;
            font-size: .8rem;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 0 9px 20px rgba(85,34,182,.20);
        }

        @media (max-width: 992px) {
            #menu-container {
                display: none;
            }

            main {
                padding: 16px 14px 74px;
            }

            .header-pagina {
                align-items: flex-start;
                flex-direction: column;
                padding: 18px;
            }

            .header-botoes {
                width: 100%;
                justify-content: flex-start;
            }

            .btn-header {
                flex: 1 1 180px;
            }
        }

        @media (max-width: 620px) {
            main {
                padding-top: 70px;
            }

            .header-pagina {
                border-radius: 18px;
            }

            .header-titulo h1 {
                font-size: 1.35rem;
            }

            .header-titulo p {
                font-size: .76rem;
            }

            .header-botoes {
                display: grid;
                grid-template-columns: 1fr;
            }

            .btn-header {
                width: 100%;
                min-height: 40px;
                padding: 9px 12px;
                font-size: .72rem;
            }

            .secao-planos {
                padding: 14px;
                border-radius: 18px;
            }

            .secao-cabecalho {
                align-items: flex-start;
                flex-direction: column;
                gap: 3px;
            }

            #lista-de-planos {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .card-plano-item {
                min-height: 155px;
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <aside id="menu-container"></aside>

    <main>
        <div class="pagina-shell">
            <header class="header-pagina">
                <div class="header-titulo">
                    <h1>Meus Planos de Assinatura</h1>
                    <p>Crie e gerencie planos para fidelizar clientes e organizar os serviços recorrentes do pet shop.</p>
                </div>

                <div class="header-botoes">
                    <a href="lista-assinantes.html" class="btn-header btn-assinantes" id="btnAssinantes">
                        <i class="fa-solid fa-crown"></i>
                        Clientes Assinantes
                    </a>

                    <a href="dashboard-pagamentos.html" class="btn-header btn-dashboard" id="btnDashboard">
                        <i class="fa-solid fa-check-to-slot"></i>
                        Painel de Aprovações
                    </a>

                    <a href="criar-plano.html" class="btn-header btn-novo" id="btnNovoPlano">
                        <i class="fa-solid fa-plus"></i>
                        Criar Novo Plano
                    </a>
                </div>
            </header>

            <section class="secao-planos">
                <div class="secao-cabecalho">
                    <h2>Planos cadastrados</h2>
                    <span>Selecione um plano para visualizar ou editar</span>
                </div>

                <div id="lista-de-planos">
                    <p class="info">A carregar...</p>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="planos.js"></script>
</body>
</html>
