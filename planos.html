<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Planos - Pronti Pet</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:400,600,700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Inclua o CSS global da Pronti -->
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --pet-roxo: #5522b6;
            --pet-roxo-2: #7140dc;
            --pet-roxo-escuro: #201042;
            --pet-amarelo: #ffc928;
            --pet-fundo: #f8f5ff;
            --pet-card: #ffffff;
            --pet-borda: #e7def8;
            --pet-texto: #17113d;
            --pet-muted: #726b86;
            --pet-verde: #16a34a;
            --pet-azul: #2563eb;
            --pet-laranja: #ea7b12;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            color: var(--pet-texto);
            background:
                radial-gradient(circle at 88% 4%, rgba(255, 201, 40, .14), transparent 22rem),
                radial-gradient(circle at 20% 88%, rgba(113, 64, 220, .10), transparent 24rem),
                linear-gradient(180deg, #fbfaff 0%, var(--pet-fundo) 100%);
            min-height: 100vh;
            display: flex;
        }

        #menu-container {
            width: 250px;
            min-width: 250px;
            flex-shrink: 0;
        }

        main {
            flex-grow: 1;
            padding: 30px;
            margin-left: 0;
            min-height: 100vh;
            box-sizing: border-box;
            background: transparent;
            display: flex;
            flex-direction: column;
        }

        .header-pagina {
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 22px 24px;
            flex-wrap: wrap;
            gap: 16px;
            border: 1px solid var(--pet-borda);
            border-radius: 22px;
            background:
                radial-gradient(circle at 90% 20%, rgba(255,201,40,.18), transparent 10rem),
                linear-gradient(135deg, #ffffff 0%, #f8f3ff 100%);
            box-shadow: 0 16px 38px rgba(32,16,66,.08);
        }

        .header-pagina::after {
            content: "🐾";
            position: absolute;
            right: 22px;
            bottom: -22px;
            font-size: 5rem;
            opacity: .05;
            transform: rotate(-18deg);
            pointer-events: none;
        }

        .header-pagina h1 {
            position: relative;
            z-index: 1;
            color: var(--pet-roxo-escuro);
            font-size: clamp(1.55rem, 3vw, 2.2rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -.035em;
            margin: 0;
        }

        .header-botoes {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-header {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 42px;
            padding: 10px 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: .78rem;
            transition: transform .2s ease, box-shadow .2s ease;
            box-shadow: 0 8px 18px rgba(32,16,66,.10);
            border: none;
            cursor: pointer;
        }

        .btn-header:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(32,16,66,.16);
        }

        .btn-assinantes {
            background: linear-gradient(135deg, var(--pet-roxo), var(--pet-roxo-2));
            color: #fff;
        }

        .btn-assinantes:hover {
            background: linear-gradient(135deg, #43168f, #6230c8);
        }

        .btn-dashboard {
            background: linear-gradient(135deg, #d99b00, var(--pet-amarelo));
            color: #2b1558;
        }

        .btn-dashboard:hover {
            background: linear-gradient(135deg, #c98e00, #f1b915);
        }

        .btn-novo {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #fff;
        }

        .btn-novo:hover {
            background: linear-gradient(135deg, #15803d, #16a34a);
        }

        .espaco-cards {
            height: 2px;
        }

        #lista-de-planos {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            margin-top: 0;
            padding: 20px;
            border: 1px solid var(--pet-borda);
            border-radius: 22px;
            background: rgba(255,255,255,.74);
            box-shadow: 0 14px 34px rgba(32,16,66,.055);
            backdrop-filter: blur(6px);
        }

        .card-plano-item {
            position: relative;
            overflow: hidden;
            display: block;
            min-height: 180px;
            padding: 24px 22px;
            border: 1px solid var(--pet-borda);
            border-top: 5px solid var(--pet-roxo);
            border-radius: 18px;
            background:
                radial-gradient(circle at 100% 0%, rgba(255,201,40,.10), transparent 9rem),
                linear-gradient(180deg, #ffffff 0%, #fbf9ff 100%);
            text-decoration: none;
            color: var(--pet-texto);
            box-shadow: 0 10px 25px rgba(32,16,66,.065);
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
            margin-top: 0;
        }

        .card-plano-item::after {
            content: "\f061";
            position: absolute;
            right: 18px;
            bottom: 16px;
            color: var(--pet-roxo);
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            font-size: .8rem;
        }

        .card-plano-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 34px rgba(32,16,66,.11);
            border-color: #d7c7ff;
        }

        .card-plano-item h3 {
            margin-top: 0;
            margin-bottom: 8px;
            padding-right: 26px;
            color: var(--pet-roxo-escuro);
            font-size: 1.15rem;
            font-weight: 700;
        }

        .card-plano-item .preco {
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--pet-verde);
            margin-bottom: 12px;
        }

        .metodo {
            font-weight: 800;
            padding: 6px 11px;
            border-radius: 999px;
            color: #fff;
            display: inline-block;
            font-size: .68rem;
            text-transform: uppercase;
            margin-top: 6px;
        }

        .metodo-automatico {
            background: linear-gradient(135deg, #2563eb, #4f83f1);
        }

        .metodo-manual {
            background: linear-gradient(135deg, #d99b00, var(--pet-amarelo));
            color: #2b1558;
        }

        .erro {
            grid-column: 1 / -1;
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 15px;
            border-radius: 12px;
            font-weight: 700;
            margin: 0;
        }

        .info {
            grid-column: 1 / -1;
            color: var(--pet-muted);
            font-weight: 700;
            margin: 0;
            padding: 28px;
            text-align: center;
        }

        .card-plano-vazio {
            grid-column: 1 / -1;
            width: min(100%, 480px);
            min-height: 310px;
            margin: 14px auto;
            padding: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--pet-borda);
            border-top: 5px solid var(--pet-amarelo);
            border-radius: 22px;
            background:
                radial-gradient(circle at 50% 0%, rgba(255,201,40,.13), transparent 11rem),
                #fff;
            color: var(--pet-texto);
            text-align: center;
            box-shadow: 0 14px 34px rgba(32,16,66,.08);
        }

        .card-vazio-content i {
            display: block;
            margin-bottom: 18px;
            color: var(--pet-amarelo);
            font-size: 2.8rem;
        }

        .card-vazio-content h2 {
            margin-bottom: 12px;
            color: var(--pet-roxo-escuro);
            font-size: 1.18rem;
            font-weight: 700;
        }

        .card-vazio-content p {
            margin-bottom: 22px;
            color: var(--pet-muted);
            font-size: .92rem;
        }

        .btn-novo-card {
            display: inline-block;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--pet-roxo), var(--pet-roxo-2));
            color: #fff;
            font-size: .82rem;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 9px 20px rgba(85,34,182,.20);
            transition: transform .2s ease;
        }

        .btn-novo-card:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #43168f, #6230c8);
        }

        @media (max-width: 992px) {
            #menu-container {
                display: none;
            }

            main {
                margin-left: 0;
                padding: 20px;
            }
        }

        @media (max-width: 768px) {
            main {
                padding: 16px;
                padding-top: 70px;
            }

            .header-pagina {
                align-items: flex-start;
                flex-direction: column;
                padding: 18px;
                border-radius: 18px;
            }

            .header-pagina h1 {
                font-size: 1.35rem;
            }

            .header-botoes {
                width: 100%;
                display: grid;
                grid-template-columns: 1fr;
            }

            .btn-header {
                width: 100%;
            }

            #lista-de-planos {
                grid-template-columns: 1fr;
                gap: 14px;
                padding: 14px;
                border-radius: 18px;
            }

            .card-plano-item {
                min-height: 155px;
                padding: 20px 18px;
            }
        }
    </style>
</head>
<body>
    <aside id="menu-container"></aside>
    <main>
        <div class="header-pagina">
            <h1>Meus Planos de Assinatura</h1>
            <div class="header-botoes">
                <a href="lista-assinantes.html" class="btn-header btn-assinantes" id="btnAssinantes"><i class="fa-solid fa-crown"></i> Clientes Assinantes</a>
                <a href="dashboard-pagamentos.html" class="btn-header btn-dashboard" id="btnDashboard"><i class="fa-solid fa-check-to-slot"></i> Painel de Aprovações</a>
                <a href="criar-plano.html" class="btn-header btn-novo" id="btnNovoPlano">+ Criar Novo Plano</a>
            </div>
        </div>
        <div class="espaco-cards"></div>
        <div id="lista-de-planos">
            <p class="info">A carregar...</p>
        </div>
    </main>

    <script type="module">
        import { db, auth } from './vitrini-firebase.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
        import { doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

        const listaContainer = document.getElementById('lista-de-planos');
        const btnNovoPlano = document.getElementById('btnNovoPlano');
        const btnDashboard = document.getElementById('btnDashboard');
        const btnAssinantes = document.getElementById('btnAssinantes');
        let empresaId = null;
        let isDono = false;
        let isAdmin = false;

        function getEmpresaIdAtiva() {
            return localStorage.getItem("empresaAtivaId") || null;
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            empresaId = getEmpresaIdAtiva();
            if (!empresaId) {
                if (listaContainer) listaContainer.innerHTML = '<p class="erro">Nenhuma empresa ativa selecionada.</p>';
                return;
            }

            try {
                const empresaRef = doc(db, "empresarios", empresaId);
                const empresaSnap = await getDoc(empresaRef);

                if (!empresaSnap.exists()) {
                    listaContainer.innerHTML = '<p class="erro">Empresa ativa não encontrada.</p>';
                    return;
                }

                const adminUID = "BX6Q7HrVMrcCBqe72r7K76EBPkX2";
                isDono = empresaSnap.data().donoId === user.uid;
                isAdmin = user.uid === adminUID;

                const showButtons = isDono || isAdmin;
                if (btnNovoPlano) btnNovoPlano.style.display = showButtons ? 'inline-flex' : 'none';
                if (btnDashboard) btnDashboard.style.display = showButtons ? 'inline-flex' : 'none';
                if (btnAssinantes) btnAssinantes.style.display = showButtons ? 'inline-flex' : 'none';

                let papelUsuario = [];
                if (isAdmin) papelUsuario.push('admin');
                if (isDono) papelUsuario.push('dono');
                if (papelUsuario.length === 0) papelUsuario.push('funcionario');

                await carregarMenu(papelUsuario);
                await carregarPlanos(empresaId);

            } catch (error) {
                console.error("Erro ao carregar dados da página:", error);
                listaContainer.innerHTML = '<p class="erro">Ocorreu um erro ao carregar os dados. Tente novamente.</p>';
            }
        });

        async function carregarMenu(papelUsuario) {
            try {
                const response = await fetch('menu-lateral.html');
                document.getElementById('menu-container').innerHTML = await response.text();
                const menuModule = await import('./menu-lateral.js');
                if (menuModule.ativarMenuLateral) await menuModule.ativarMenuLateral(papelUsuario);
            } catch (error) {
                console.error("Falha ao carregar o menu lateral:", error);
            }
        }

        async function carregarPlanos(empresaId) {
            try {
                const planosRef = collection(db, `empresarios/${empresaId}/planosDeAssinatura`);
                const snapshot = await getDocs(planosRef);

                if (snapshot.empty) {
                    listaContainer.innerHTML = `
                        <div class="card-plano-vazio">
                            <div class="card-vazio-content">
                                <i class="fa-solid fa-crown"></i>
                                <h2>Você ainda não criou nenhum plano!</h2>
                                <p>Crie seu primeiro plano para começar a fidelizar seus clientes.</p>
                                <a href="criar-plano.html" class="btn-novo-card">+ Criar Novo Plano</a>
                            </div>
                        </div>
                    `;
                    return;
                }
                listaContainer.innerHTML = '';
                snapshot.docs.forEach(doc => {
                    const plano = { id: doc.id, ...doc.data() };
                    const card = document.createElement('a');
                    card.href = `criar-plano.html?id=${plano.id}`;
                    card.className = 'card-plano-item';
                    const precoFormatado = (plano.preco || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    card.innerHTML = `
                        <h3>${sanitizeHTML(plano.nome)}</h3>
                        <p class="preco">${precoFormatado} /mês</p>
                        <span class="metodo metodo-${plano.metodo}">${plano.metodo === 'automatico' ? 'Automático (MP)' : 'Manual (PIX)'}</span>
                    `;
                    listaContainer.appendChild(card);
                });
            } catch (error) {
                console.error("Erro ao carregar planos:", error);
                listaContainer.innerHTML = '<p class="erro">Ocorreu um erro ao carregar os planos.</p>';
            }
        }

        function sanitizeHTML(str) {
            if (!str) return "";
            const temp = document.createElement('div');
            temp.textContent = str;
            return temp.innerHTML;
        }
    </script>
</body>
</html>
