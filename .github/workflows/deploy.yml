name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install functions dependencies
        working-directory: ./functions
        run: |
          rm -rf node_modules
          npm install

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRONTI_PET }}
          projectId: pronti-pet
          channelId: live

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup Firebase credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRONTI_PET }}' > $HOME/firebase-credentials.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-credentials.json" >> $GITHUB_ENV

      - name: Validate Functions code
        working-directory: ./functions
        run: node index.js

      - name: Deploy Cloud Functions
        env:
          FIRESTORE_EMULATOR_HOST: ""
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        run: firebase deploy --only functions --project pronti-pet --non-interactive --force

      - name: Cleanup credentials
        if: always()
        run: rm -f $HOME/firebase-credentials.json
