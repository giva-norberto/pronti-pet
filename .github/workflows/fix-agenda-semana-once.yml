name: Corrigir agenda semanal uma vez

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-agenda-semana:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir intervalo semanal
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('agenda.js')
          text = path.read_text(encoding='utf-8')

          old = '''function getFimSemana(dataBaseStr) {
            const [ano, mes, dia] = dataBaseStr.split("-").map(Number);
            const inicio = new Date(ano, mes - 1, dia);
            const diaDaSemana = inicio.getDay();
            const diasAteDomingo = 7 - diaDaSemana;
            const fim = new Date(inicio);

            fim.setDate(inicio.getDate() + diasAteDomingo - 1);

            return formatarDataISO(fim);
          }'''

          new = '''function getFimSemana(dataBaseStr) {
            const [ano, mes, dia] = dataBaseStr.split("-").map(Number);
            const inicio = new Date(ano, mes - 1, dia);
            const fim = new Date(inicio);

            // Agenda da Semana = período contínuo de 7 dias a partir
            // da data selecionada. Ex.: 12/09 -> 18/09.
            fim.setDate(inicio.getDate() + 6);

            return formatarDataISO(fim);
          }'''

          if text.count(old) != 1:
              raise SystemExit(f'Bloco esperado encontrado {text.count(old)} vez(es); abortando.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit da correção
        run: |
          if git diff --quiet -- agenda.js; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "pronti-pet-bot"
          git config user.email "pronti-pet-bot@users.noreply.github.com"
          git add agenda.js
          git commit -m "Corrige intervalo da agenda semanal"
          git push origin HEAD:main
