name: Corrigir agenda dia e atualização automática uma vez

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  aplicar-correcoes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correções cirúrgicas
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          # Agenda do Dia
          path = Path('agenda.js')
          text = path.read_text(encoding='utf-8')

          padrao_func = re.compile(
              r'async function encontrarProximoDiaComExpediente\(empresaId, dataInicialISO\) \{.*?\n\}',
              re.S
          )
          nova_func = '''async function encontrarProximoDiaRelevante(empresaId, dataInicialISO) {
            const [ano, mes, dia] = dataInicialISO.split("-").map(Number);
            const data = new Date(ano, mes - 1, dia);

            // Sempre procura a partir do dia seguinte.
            data.setDate(data.getDate() + 1);

            for (let i = 0; i < 60; i++) {
              const dataISO = formatarDataISO(data);

              const [temExpediente, agendamentosSnap] = await Promise.all([
                diaTemExpediente(empresaId, dataISO),
                getDocs(
                  query(
                    collection(db, "empresarios", empresaId, "agendamentos"),
                    where("data", "==", dataISO)
                  )
                )
              ]);

              const temAgendamentoAtivo = agendamentosSnap.docs.some((docSnap) => {
                const ag = docSnap.data() || {};
                return ag.status === "ativo";
              });

              if (temExpediente || temAgendamentoAtivo) {
                return dataISO;
              }

              data.setDate(data.getDate() + 1);
            }

            const fallback = new Date(ano, mes - 1, dia);
            fallback.setDate(fallback.getDate() + 1);
            return formatarDataISO(fallback);
          }'''

          text, n = padrao_func.subn(nova_func, text, count=1)
          if n != 1:
              raise SystemExit(f'Função de próximo dia encontrada {n} vez(es); abortando.')

          chamada_antiga = 'dataFiltrar = await encontrarProximoDiaComExpediente(empresaId, hojeISO);'
          if text.count(chamada_antiga) != 2:
              raise SystemExit(f'Chamadas antigas encontradas {text.count(chamada_antiga)} vez(es); abortando.')
          text = text.replace(
              chamada_antiga,
              'dataFiltrar = await encontrarProximoDiaRelevante(empresaId, hojeISO);'
          )

          padrao_listener = re.compile(
              r'\n  if \(btnSemanaProxima\) \{.*?\n  \}\n\n  if \(btnAplicarHistorico\)',
              re.S
          )
          novo_listener = '''
          if (btnSemanaProxima) {
            btnSemanaProxima.addEventListener("click", async () => {
              if (!inputDataSemana || !inputDataSemana.value) return;

              if (modoAgenda === "dia") {
                inputDataSemana.value = await encontrarProximoDiaRelevante(
                  empresaId,
                  inputDataSemana.value
                );
                carregarAgendamentosConformeModo();
                return;
              }

              if (modoAgenda === "semana") {
                const [ano, mes, dia] = inputDataSemana.value.split("-").map(Number);
                const dataAtual = new Date(ano, mes - 1, dia);
                dataAtual.setDate(dataAtual.getDate() + 7);
                inputDataSemana.value = formatarDataISO(dataAtual);
                carregarAgendamentosConformeModo();
              }
            });
          }

          if (btnAplicarHistorico)'''

          text, n = padrao_listener.subn('\n' + novo_listener, text, count=1)
          if n != 1:
              raise SystemExit(f'Listener de avanço encontrado {n} vez(es); abortando.')

          path.write_text(text, encoding='utf-8')

          # Atualização PWA automática
          Path('pwa-update.js').write_text("""(() => {
            'use strict';

            const CHAVE_VERSAO = 'pronti_pet_versao_instalada';
            const URL_VERSAO = '/version.json';

            let registroAtual = null;
            let versaoDisponivel = null;
            let atualizando = false;
            let recarregou = false;

            async function limparCachesPronti() {
              if (!('caches' in window)) return;
              const chaves = await caches.keys();
              await Promise.all(
                chaves
                  .filter((chave) => chave.startsWith('pronti-pet-'))
                  .map((chave) => caches.delete(chave))
              );
            }

            function recarregarComVersao() {
              const url = new URL(window.location.href);
              url.searchParams.set('v', versaoDisponivel || String(Date.now()));
              window.location.replace(url.href);
            }

            async function buscarVersao() {
              const resposta = await fetch(`${URL_VERSAO}?t=${Date.now()}`, { cache: 'no-store' });
              if (!resposta.ok) throw new Error(`Falha ao consultar versão: ${resposta.status}`);
              const dados = await resposta.json();
              return String(dados.version || '').trim();
            }

            async function ativarNovaVersao() {
              if (atualizando || !registroAtual) return;
              const worker = registroAtual.waiting || registroAtual.installing;
              if (!worker) return;

              atualizando = true;

              if (worker.state === 'installed') {
                worker.postMessage({ type: 'SKIP_WAITING' });
                return;
              }

              worker.addEventListener('statechange', () => {
                if (worker.state === 'installed') {
                  worker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            }

            function observarInstalacao(registro) {
              registro.addEventListener('updatefound', () => {
                const novoWorker = registro.installing;
                if (!novoWorker) return;

                novoWorker.addEventListener('statechange', () => {
                  if (novoWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    ativarNovaVersao();
                  }
                });
              });
            }

            async function registrarWorker(versao) {
              const registro = await navigator.serviceWorker.register(
                `/firebase-messaging-sw.js?v=${encodeURIComponent(versao)}`,
                { scope: '/', updateViaCache: 'none' }
              );

              registroAtual = registro;
              observarInstalacao(registro);
              await registro.update();

              if (registro.waiting && navigator.serviceWorker.controller) {
                await ativarNovaVersao();
              }
            }

            async function verificarAtualizacao() {
              if (!('serviceWorker' in navigator) || !window.isSecureContext) return;

              try {
                const versaoRemota = await buscarVersao();
                if (!versaoRemota) return;

                const versaoLocal = localStorage.getItem(CHAVE_VERSAO);
                versaoDisponivel = versaoRemota;

                if (!versaoLocal) {
                  const jaEraControlado = Boolean(navigator.serviceWorker.controller);
                  await registrarWorker(versaoRemota);
                  if (!jaEraControlado) localStorage.setItem(CHAVE_VERSAO, versaoRemota);
                  return;
                }

                if (versaoRemota === versaoLocal) {
                  if (!registroAtual) await registrarWorker(versaoRemota);
                  return;
                }

                await registrarWorker(versaoRemota);
                if (registroAtual?.waiting) await ativarNovaVersao();
              } catch (erro) {
                atualizando = false;
                console.warn('[Pronti Pet] Verificação automática de atualização indisponível:', erro);
              }
            }

            navigator.serviceWorker?.addEventListener('controllerchange', async () => {
              if (recarregou) return;
              recarregou = true;

              if (versaoDisponivel) localStorage.setItem(CHAVE_VERSAO, versaoDisponivel);

              try {
                await limparCachesPronti();
              } catch (erro) {
                console.warn('[Pronti Pet] Não foi possível limpar cache antigo:', erro);
              }

              recarregarComVersao();
            });

            window.addEventListener('load', verificarAtualizacao, { once: true });
          })();
          """, encoding='utf-8')

          # Bypass do cache do módulo
          menu = Path('menu-lateral.js')
          menu_text = menu.read_text(encoding='utf-8')
          menu_text, n = re.subn(
              r'import "\./pwa-update\.js\?v=[^"]+";',
              'import "./pwa-update.js?v=1.0.3";',
              menu_text,
              count=1
          )
          if n != 1:
              raise SystemExit(f'Import pwa-update encontrado {n} vez(es); abortando.')
          menu.write_text(menu_text, encoding='utf-8')

          version_path = Path('version.json')
          version_data = json.loads(version_path.read_text(encoding='utf-8'))
          version_data.update({
              'version': '1.0.3',
              'updatedAt': '2026-09-12',
              'notes': 'Correção da agenda diária e semanal com atualização automática do app'
          })
          version_path.write_text(json.dumps(version_data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit das correções
        run: |
          git config user.name "pronti-pet-bot"
          git config user.email "pronti-pet-bot@users.noreply.github.com"
          git add agenda.js pwa-update.js menu-lateral.js version.json
          git commit -m "Corrige agenda diária e ativa atualização automática"
          git push origin HEAD:main
