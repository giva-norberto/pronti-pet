<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Aprovação de Pagamentos - Pronti Pet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css"> <!-- Seu CSS principal do Pronti -->
    <style>
        :root {
            --pet-roxo: #5522b6;
            --pet-roxo-2: #7140dc;
            --pet-roxo-escuro: #201042;
            --pet-amarelo: #ffc928;
            --pet-fundo: #f8f5ff;
            --pet-card: #ffffff;
            --pet-borda: #e7def8;
            --pet-texto: #17113d;
            --pet-muted: #726b86;
            --pet-verde: #16a34a;
            --pet-azul: #2563eb;
            --pet-vermelho: #dc2626;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: var(--pet-texto);
            background:
                radial-gradient(circle at 90% 5%, rgba(255, 201, 40, .15), transparent 22rem),
                radial-gradient(circle at 15% 85%, rgba(113, 64, 220, .10), transparent 24rem),
                linear-gradient(180deg, #fbfaff 0%, var(--pet-fundo) 100%);
        }

        #menu-container {
            width: 250px;
            min-width: 250px;
            flex-shrink: 0;
        }

        main.content {
            flex-grow: 1;
            min-width: 0;
            min-height: 100vh;
            padding: 28px 30px 78px;
            display: flex;
            flex-direction: column;
            background: transparent;
        }

        .header-pagina {
            position: relative;
            overflow: hidden;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
            padding: 22px 24px;
            border: 1px solid var(--pet-borda);
            border-radius: 22px;
            background:
                radial-gradient(circle at 90% 20%, rgba(255,201,40,.18), transparent 10rem),
                linear-gradient(135deg, #ffffff 0%, #f8f3ff 100%);
            box-shadow: 0 16px 38px rgba(32,16,66,.08);
        }

        .header-pagina::after {
            content: "🐾";
            position: absolute;
            right: 22px;
            bottom: -22px;
            font-size: 5rem;
            opacity: .05;
            transform: rotate(-18deg);
            pointer-events: none;
        }

        .header-pagina h1 {
            position: relative;
            z-index: 1;
            margin: 0;
            color: var(--pet-roxo-escuro);
            font-size: clamp(1.55rem, 3vw, 2.2rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -.035em;
        }

        .header-botoes {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-header {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 15px;
            border: none;
            border-radius: 12px;
            font-size: .78rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(32,16,66,.10);
            transition: transform .18s ease, box-shadow .18s ease;
        }

        .btn-header:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(32,16,66,.16);
        }

        .btn-assinantes {
            background: linear-gradient(135deg, var(--pet-roxo), var(--pet-roxo-2));
            color: #fff;
        }

        .btn-dashboard {
            background: linear-gradient(135deg, #d99b00, var(--pet-amarelo));
            color: #2b1558;
        }

        .btn-novo {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #fff;
        }

        .espaco-cards {
            height: 2px;
        }

        .container {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid var(--pet-borda);
            border-radius: 22px;
            background: rgba(255,255,255,.74);
            box-shadow: 0 14px 34px rgba(32,16,66,.055);
            backdrop-filter: blur(6px);
        }

        .lista-pagamentos {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item {
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            padding: 18px;
            border: 1px solid var(--pet-borda);
            border-left: 5px solid var(--pet-amarelo);
            border-radius: 16px;
            background:
                radial-gradient(circle at 100% 0%, rgba(255,201,40,.09), transparent 8rem),
                linear-gradient(180deg, #ffffff 0%, #fbf9ff 100%);
            box-shadow: 0 8px 20px rgba(32,16,66,.055);
        }

        .item::after {
            content: "🐾";
            position: absolute;
            right: 14px;
            bottom: -10px;
            font-size: 3.4rem;
            opacity: .04;
            transform: rotate(-18deg);
            pointer-events: none;
        }

        .info {
            position: relative;
            z-index: 1;
            min-width: 0;
            flex: 1;
        }

        .info p {
            margin: 0;
            line-height: 1.5;
        }

        .info .nome {
            color: var(--pet-roxo-escuro);
            font-size: 1rem;
            font-weight: 700;
        }

        .info .doc-id {
            margin-top: 3px;
            color: #9a93aa;
            font-family: monospace;
            font-size: .66rem;
            overflow-wrap: anywhere;
        }

        .info .plano {
            margin-top: 7px;
            color: #5f5872;
            font-size: .8rem;
        }

        .info .metodo {
            display: inline-flex;
            align-items: center;
            margin-left: 7px;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: .62rem;
            font-weight: 800;
            text-transform: uppercase;
            vertical-align: middle;
        }

        .metodo.pix {
            background: #ecfdf3;
            color: #15803d;
        }

        .metodo.mercado_pago {
            background: #eaf2ff;
            color: var(--pet-azul);
        }

        .acoes {
            position: relative;
            z-index: 1;
        }

        .acoes button {
            min-height: 40px;
            padding: 9px 16px;
            border: none;
            border-radius: 11px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: .78rem;
            font-weight: 700;
            transition: transform .18s ease, box-shadow .18s ease;
        }

        .btn-aprovar {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #fff;
            box-shadow: 0 8px 18px rgba(22,163,74,.17);
        }

        .btn-aprovar:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 11px 22px rgba(22,163,74,.23);
        }

        .btn-aprovar:disabled {
            background: #a8a3b1;
            cursor: not-allowed;
            box-shadow: none;
        }

        #loading-message,
        #empty-message {
            margin: 0;
            padding: 40px 20px;
            color: var(--pet-muted);
            font-weight: 700;
            text-align: center;
        }

        @media (max-width: 992px) {
            #menu-container {
                display: none;
            }

            main.content {
                padding: 70px 14px 70px;
            }
        }

        @media (max-width: 768px) {
            .header-pagina {
                align-items: flex-start;
                flex-direction: column;
                padding: 18px;
                border-radius: 18px;
            }

            .header-pagina h1 {
                font-size: 1.35rem;
            }

            .header-botoes {
                width: 100%;
                display: grid;
                grid-template-columns: 1fr;
            }

            .btn-header {
                width: 100%;
                min-height: 40px;
                padding: 9px 12px;
                font-size: .72rem;
            }

            .container {
                padding: 14px;
                border-radius: 18px;
            }

            .item {
                align-items: stretch;
                flex-direction: column;
                padding: 15px;
            }

            .acoes {
                width: 100%;
            }

            .acoes button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <aside id="menu-container"></aside>
    <main class="content">
        <div class="header-pagina">
            <h1>Pagamentos Pendentes de Aprovação</h1>
            <div class="header-botoes">
                <a href="lista-assinantes.html" class="btn-header btn-assinantes"><i class="fa-solid fa-crown"></i> Clientes Assinantes</a>
                <a href="dashboard-pagamentos.html" class="btn-header btn-dashboard"><i class="fa-solid fa-check-to-slot"></i> Painel de Aprovações</a>
                <a href="planos.html" class="btn-header btn-novo"><i class="fa-solid fa-plus"></i> Meus Planos</a>
            </div>
        </div>
        <div class="espaco-cards"></div>
        <div class="container">
            <div id="lista-pagamentos" class="lista-pagamentos">
                <p id="loading-message">Carregando pagamentos...</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { db, auth } from './vitrini-firebase.js'; 
        import {
            collection,
            query,
            where,
            onSnapshot,
            doc,
            runTransaction,
            serverTimestamp,
            Timestamp,
            getDoc,
            addDoc
        } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';

        const listaPagamentosDiv = document.getElementById('lista-pagamentos');
        const loadingMessage = document.getElementById('loading-message');
        let unsubscribe = null;

        async function carregarMenu() {
            try {
                const response = await fetch('menu-lateral.html');
                if (!response.ok) throw new Error('menu-lateral.html not found');
                document.getElementById('menu-container').innerHTML = await response.text();
                const menuModule = await import('./menu-lateral.js');
                if (menuModule.ativarMenuLateral) menuModule.ativarMenuLateral(['dono']);
            } catch (error) {
                console.error("Failed to load sidebar:", error);
            }
        }
        carregarMenu();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const empresaAtivaId = localStorage.getItem("empresaAtivaId");
                if (empresaAtivaId) {
                     ouvirPagamentosPendentes(empresaAtivaId);
                } else {
                    listaPagamentosDiv.innerHTML = '<p id="empty-message">Nenhuma empresa ativa selecionada.</p>';
                }
            } else {
                if (unsubscribe) unsubscribe();
                listaPagamentosDiv.innerHTML = '<p id="empty-message">Você precisa estar logado para ver esta página.</p>';
            }
        });

        function ouvirPagamentosPendentes(empresaId) {
            const pagamentosRef = collection(db, 'pagamentosPendentes');
            const q = query(pagamentosRef, 
                where('empresaId', '==', empresaId), 
                where('status', 'in', ['pendente_confirmacao', 'aguardando_pagamento_mp'])
            );

            unsubscribe = onSnapshot(q, (snapshot) => {
                loadingMessage.style.display = 'none';
                if (snapshot.empty) {
                    listaPagamentosDiv.innerHTML = '<p id="empty-message">Nenhum pagamento pendente no momento.</p>';
                    return;
                }
                
                listaPagamentosDiv.innerHTML = '';
                snapshot.forEach(docSnap => {
                    const pagamento = { id: docSnap.id, ...docSnap.data() };
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'item';
                    
                    const metodoTag = `<span class="metodo ${pagamento.metodo}">${(pagamento.metodo || '').replace('_', ' ')}</span>`;
                    const dataFormatada = pagamento.dataCriacao?.toDate?.().toLocaleDateString('pt-BR') || 'Data indisponível';

                    itemDiv.innerHTML = `
                        <div class="info">
                            <p class="nome">${pagamento.clienteNome}</p>
                            <p class="doc-id">ID: ${pagamento.id}</p>
                            <p class="plano">${pagamento.planoNome || ''} - R$ ${Number(pagamento.valor || 0).toFixed(2)} ${metodoTag} - ${dataFormatada}</p>
                        </div>
                        <div class="acoes">
                            <button class="btn-aprovar" data-id="${pagamento.id}">Aprovar</button>
                        </div>
                    `;
                    listaPagamentosDiv.appendChild(itemDiv);
                });
            });
        }

        listaPagamentosDiv.addEventListener('click', async (e) => {
            if (e.target && e.target.classList.contains('btn-aprovar')) {
                const pagamentoId = e.target.dataset.id;
                if (!confirm(`Tem certeza de que deseja aprovar este pagamento?`)) return;
                
                e.target.disabled = true;
                e.target.textContent = 'Aprovando...';

                try {
                    await runTransaction(db, async (transaction) => {
                        // --- READS: executar todas as leituras primeiro ---
                        const pagRef = doc(db, "pagamentosPendentes", pagamentoId);
                        const pagDoc = await transaction.get(pagRef);
                        if (!pagDoc.exists()) throw new Error("Documento do pagamento não existe mais.");
                        const dadosPagamento = pagDoc.data();

                        const clienteRef = doc(db, `empresarios/${dadosPagamento.empresaId}/clientes/${dadosPagamento.clienteId}`);
                        const clienteSnap = await transaction.get(clienteRef);

                        // Ler o plano DENTRO da transação (leitura antes de qualquer escrita)
                        const planoRef = doc(db, `empresarios/${dadosPagamento.empresaId}/planosDeAssinatura/${dadosPagamento.planoId}`);
                        const planoSnap = await transaction.get(planoRef);
                        const servicosPlano = planoSnap.exists() ? (Array.isArray(planoSnap.data().servicosInclusos) ? planoSnap.data().servicosInclusos : []) : [];

                        // --- WRITES: agora que todas as leituras foram feitas, podemos escrever ---
                        if (!clienteSnap.exists()) {
                            transaction.set(clienteRef, {
                                nome: dadosPagamento.clienteNome,
                                email: dadosPagamento.clienteEmail || null,
                                dataCadastro: serverTimestamp(),
                            });
                        }
                        
                        const dataInicio = new Date();
                        const dataFim = new Date(dataInicio);
                        dataFim.setMonth(dataFim.getMonth() + 1);

                        // Prepara serviços para a assinatura: quantidadeRestante baseado no plano (0 = ilimitado)
                        const servicosParaAssinatura = servicosPlano.map(s => ({
                            servicoId: s.servicoId,
                            nomeServico: s.nomeServico || s.nome || '',
                            quantidadeRestante: (typeof s.quantidade === 'number') ? s.quantidade : 0
                        }));

                        const novaAssinaturaRef = doc(collection(clienteRef, "assinaturas"));
                        
                        // Monta objeto da assinatura incluindo servicosInclusos com quantidadeRestante
                        const assinaturaObj = {
                            empresaId: dadosPagamento.empresaId,
                            planoId: dadosPagamento.planoId,
                            planoNome: (planoSnap.exists() ? planoSnap.data().nome : dadosPagamento.planoNome) || dadosPagamento.planoNome || null,
                            status: "ativo",
                            dataInicio: Timestamp.fromDate(dataInicio),
                            dataFim: Timestamp.fromDate(dataFim),
                            pagamentoId: pagamentoId,
                            dataCriacao: serverTimestamp(),
                            servicosInclusos: servicosParaAssinatura
                        };

                        // Grava assinatura e marca pagamento como aprovado em uma única transação
                        transaction.set(novaAssinaturaRef, assinaturaObj);
                        transaction.update(pagRef, { status: "aprovado", assinaturaId: novaAssinaturaRef.id, aprovadoEm: serverTimestamp() });
                    });

                    // Após transação bem-sucedida, cria uma notificação para o dono (fora da transação)
                    try {
                        const pagamentoSnap = await getDoc(doc(db, "pagamentosPendentes", pagamentoId));
                        const dadosPagamento = pagamentoSnap.exists() ? pagamentoSnap.data() : null;
                        if (dadosPagamento && dadosPagamento.empresaId) {
                            const empresaSnap = await getDoc(doc(db, `empresarios/${dadosPagamento.empresaId}`));
                            const donoId = empresaSnap.exists() ? empresaSnap.data().donoId : null;
                            if (donoId) {
                                await addDoc(collection(db, "filaDeNotificacoes"), {
                                    donoId,
                                    tipo: 'ASSINATURA_ATIVADA',
                                    titulo: 'Assinatura ativada',
                                    mensagem: `Assinatura ${dadosPagamento.planoNome || ''} ativada para ${dadosPagamento.clienteNome || ''}.`,
                                    lido: false,
                                    dataCriacao: serverTimestamp()
                                });
                            }
                        }
                    } catch (notifyErr) {
                        console.warn("Não foi possível criar notificação após aprovação:", notifyErr);
                    }

                    // opcional: atualizar UI (o onSnapshot cuidará de remover o item)
                } catch (error) {
                    console.error("Erro ao aprovar pagamento:", error);
                    alert('Falha ao aprovar o pagamento: ' + (error.message || error));
                    e.target.disabled = false;
                    e.target.textContent = 'Aprovar';
                }
            }
        });
    </script>
</body>
</html>
