<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronti Pet - Serviços</title>

    <link rel="stylesheet" href="style.css?v=pet-servicos-revisado">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --pet-roxo: #5522b6;
            --pet-roxo-2: #7140dc;
            --pet-roxo-escuro: #201042;
            --pet-amarelo: #ffc928;
            --pet-fundo: #f8f5ff;
            --pet-card: #ffffff;
            --pet-borda: #e7def8;
            --pet-texto: #17113d;
            --pet-muted: #726b86;
            --pet-verde: #16a34a;
            --pet-vermelho: #ef4444;
            --gradient-primary:
                radial-gradient(circle at 100% 0%, rgba(255, 201, 40, .14), transparent 20rem),
                radial-gradient(circle at 10% 18%, rgba(113, 64, 220, .12), transparent 24rem),
                linear-gradient(180deg, #fbfaff 0%, var(--pet-fundo) 100%);
            --primary-color: var(--pet-roxo);
            --primary-hover: #42188f;
            --special-color: var(--pet-verde);
            --special-hover: #15803d;
            --danger-color: var(--pet-vermelho);
            --danger-hover: #dc2626;
            --warning-color: var(--pet-amarelo);
            --sidebar-width: 230px;
            --card-radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body.pet-page {
            font-family: 'Inter', Arial, sans-serif;
            background: var(--gradient-primary) !important;
            color: var(--pet-texto);
            min-height: 100vh;
            background-attachment: fixed !important;
        }

        #menu-container {
            position: relative;
            z-index: 20;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 28px;
            min-height: 100vh;
            width: auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            background:
                radial-gradient(circle at 92% 18%, rgba(255, 201, 40, .18), transparent 11rem),
                linear-gradient(135deg, #ffffff 0%, #f8f3ff 100%);
            padding: 20px 24px;
            border-radius: var(--card-radius);
            box-shadow: 0 12px 30px rgba(32, 16, 66, .09);
            margin-bottom: 24px;
            border: 1px solid var(--pet-borda);
            border-top: 4px solid var(--pet-amarelo);
            position: relative;
            overflow: visible;
        }

        .title-area {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
            padding-left: 2px;
        }

        .page-header h1 {
            font-size: 1.85rem;
            font-weight: 900;
            color: var(--pet-roxo-escuro);
            line-height: 1.1;
            word-break: normal;
        }

        .page-subtitle {
            color: var(--pet-muted);
            font-size: 0.92rem;
            font-weight: 500;
            line-height: 1.35;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .btn-new,
        .btn-special {
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            min-height: 42px;
            font-size: 0.95rem;
        }

        .btn-new {
            background: linear-gradient(135deg, var(--pet-roxo), var(--pet-roxo-2));
            box-shadow: 0 10px 22px rgba(85,34,182,.22);
        }

        .btn-new:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-special {
            background-color: var(--special-color);
            box-shadow: 0 8px 18px rgba(22,163,74,0.20);
        }

        .btn-special:hover {
            background-color: var(--special-hover);
            transform: translateY(-1px);
        }

        .empty-message {
            color: var(--pet-roxo-escuro);
            font-weight: 800;
            background: rgba(255,255,255,.88);
            border: 1px dashed var(--pet-borda);
            padding: 18px 20px;
            border-radius: 14px;
            max-width: 720px;
            line-height: 1.45;
        }

        .categoria-titulo {
            font-size: 1.45rem;
            font-weight: 900;
            color: var(--pet-roxo-escuro);
            margin-top: 24px;
            margin-bottom: 14px;
            text-shadow: none;
            line-height: 1.2;
        }

        .servico-card {
            background: #ffffff;
            border: 1px solid var(--pet-borda);
            border-radius: var(--card-radius);
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 10px 26px rgba(32,16,66,.08);
            transition: transform 0.18s ease-in-out, box-shadow 0.18s ease-in-out;
            overflow: hidden;
        }

        .servico-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 34px rgba(32,16,66,.12);
        }

        .servico-card-inner,
        .servico-conteudo-principal {
            display: flex;
            gap: 16px;
            align-items: stretch;
            width: 100%;
            min-width: 0;
        }

        .servico-imagem,
        .servico-foto,
        .imagem-servico {
            width: 132px;
            min-width: 132px;
            height: 112px;
            border-radius: 14px;
            overflow: hidden;
            background: linear-gradient(135deg, #f7f1ff, #fff8df);
            border: 1px solid var(--pet-borda);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .servico-imagem img,
        .servico-foto img,
        .imagem-servico img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .servico-imagem-placeholder {
            color: var(--pet-roxo);
            font-size: 2rem;
        }

        .servico-info {
            flex: 1;
            min-width: 0;
        }

        .servico-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 8px;
            min-width: 0;
        }

        .servico-titulo {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--pet-roxo-escuro);
            margin: 0;
            line-height: 1.25;
            word-break: break-word;
        }

        .servico-descricao {
            color: var(--pet-muted);
            margin: 8px 0 12px;
            line-height: 1.45;
            font-size: 0.94rem;
            word-break: break-word;
        }

        .servico-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee8fa;
        }

        .servico-preco {
            font-size: 1.1rem;
            font-weight: 900;
            color: #16a34a;
            line-height: 1.2;
        }

        .servico-duracao {
            color: var(--pet-muted);
            font-size: 0.88rem;
            font-weight: 600;
        }

        .servico-precos-lista,
        .precos-porte-lista,
        .precos-por-porte {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .preco-porte-chip,
        .porte-preco-chip,
        .chip-preco-porte {
            background: #faf8ff;
            border: 1px solid var(--pet-borda);
            color: var(--pet-roxo-escuro);
            border-radius: 999px;
            padding: 7px 10px;
            font-size: 0.82rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .preco-porte-chip strong,
        .porte-preco-chip strong,
        .chip-preco-porte strong {
            color: #16a34a;
        }

        .servico-acoes {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .btn-acao {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.86rem;
            font-weight: 800;
            transition: all 0.2s;
            min-height: 36px;
        }

        .btn-editar {
            background-color: var(--warning-color);
            color: var(--pet-roxo-escuro);
        }

        .btn-editar:hover {
            background-color: #eab308;
        }

        .btn-excluir {
            background-color: var(--danger-color);
            color: #ffffff;
        }

        .btn-excluir:hover {
            background-color: var(--danger-hover);
        }

        .modal-overlay {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(32,16,66,.56);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 16px;
        }

        .modal-overlay.ativo {
            display: flex;
            opacity: 1;
        }

        .modal-box {
            background: linear-gradient(180deg, #ffffff 0%, #fbf9ff 100%);
            padding: 26px;
            border-radius: 20px;
            border: 1px solid var(--pet-borda);
            box-shadow: 0 18px 48px rgba(32,16,66,.18);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        .modal-box h2 {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: var(--pet-roxo-escuro);
        }

        .modal-box p {
            color: #475569;
            line-height: 1.45;
        }

        .modal-botoes {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .modal-botoes button {
            border: none;
            border-radius: 9px;
            padding: 10px 16px;
            font-weight: 800;
            cursor: pointer;
        }

        #modal-btn-confirmar {
            background-color: #d9534f;
            color: white;
        }

        #modal-btn-cancelar {
            background-color: #f0f0f0;
            color: #333;
        }

        #loader {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.82);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-size: 1.2em;
            font-weight: 800;
            backdrop-filter: blur(2px);
            color: var(--pet-roxo-escuro);
        }

        @media (max-width: 900px) {
            .main-content {
                margin-left: 0;
                padding: 14px;
                padding-top: 72px;
                width: 100%;
            }

            .page-header {
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
                padding: 16px;
                border-radius: 16px;
            }

            .page-header h1 {
                font-size: 1.45rem;
                padding-left: 22px;
            }

            .page-subtitle {
                font-size: 0.88rem;
                padding-left: 22px;
            }

            .header-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 9px;
                width: 100%;
            }

            .btn-new,
            .btn-special {
                width: 100%;
                justify-content: center;
                padding: 11px 10px;
                font-size: 0.86rem;
                white-space: normal;
                text-align: center;
            }

            .categoria-titulo {
                font-size: 1.25rem;
                margin-top: 20px;
                margin-bottom: 12px;
            }

            .servico-card {
                padding: 14px;
                border-radius: 15px;
            }

            .servico-card-inner,
            .servico-conteudo-principal {
                flex-direction: column;
                gap: 12px;
            }

            .servico-imagem,
            .servico-foto,
            .imagem-servico {
                width: 100%;
                min-width: 0;
                height: 160px;
            }

            .servico-header {
                flex-direction: column;
                gap: 8px;
                margin-bottom: 6px;
            }

            .servico-titulo {
                font-size: 1.12rem;
            }

            .servico-descricao {
                font-size: 0.88rem;
            }

            .servico-footer {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .servico-preco {
                font-size: 1rem;
            }

            .servico-acoes {
                display: grid;
                grid-template-columns: 1fr 1fr;
                width: 100%;
                gap: 8px;
            }

            .btn-acao {
                width: 100%;
            }

            .servico-precos-lista,
            .precos-porte-lista,
            .precos-por-porte {
                gap: 7px;
            }

            .preco-porte-chip,
            .porte-preco-chip,
            .chip-preco-porte {
                font-size: 0.78rem;
                padding: 7px 9px;
            }
        }

        @media (max-width: 430px) {
            .main-content {
                padding-left: 10px;
                padding-right: 10px;
                padding-top: 68px;
            }

            .page-header {
                padding: 14px;
            }

            .page-header h1 {
                font-size: 1.32rem;
            }

            .header-actions {
                grid-template-columns: 1fr;
            }

            .servico-imagem,
            .servico-foto,
            .imagem-servico {
                height: 138px;
            }

            .modal-botoes {
                flex-direction: column;
            }

            .modal-botoes button {
                width: 100%;
            }
        }

        body.pet-page .page-header h1::before {
            content: "🐾";
            margin-right: 10px;
            font-size: .95em;
        }

        body.pet-page .servico-card {
            border-top: 4px solid var(--pet-roxo);
        }

        body.pet-page .servico-card:nth-of-type(2n) {
            border-top-color: var(--pet-amarelo);
        }

        body.pet-page .btn-editar {
            background: var(--pet-amarelo);
            color: var(--pet-roxo-escuro);
        }

        body.pet-page #loader {
            background: rgba(251, 250, 255, .9);
            color: var(--pet-roxo-escuro);
        }

        @media (max-width: 900px) {
            body.pet-page {
                background-attachment: scroll !important;
            }
        }

    </style>
</head>

<body class="pet-page servicos-page">

<div id="loader" style="display: none;">Carregando...</div>
<div id="menu-container"></div>

<main class="main-content">
    <div class="page-header">
        <div class="title-area">
            <h1>Serviços do Pet Shop</h1>
            <p class="page-subtitle">Cadastre os serviços que aparecerão na vitrine do Pronti Pet.</p>
        </div>

        <div class="header-actions">
            <a href="novo-servico.html" class="btn-new">
                <i class="fa-solid fa-paw"></i>
                Adicionar Serviço
            </a>

            <a href="promocoes.html" id="btnPromocoes" class="btn-special">
                <i class="fa-solid fa-tags"></i>
                Preços Especiais
            </a>
        </div>
    </div>

    <div id="lista-servicos">
        <p class="empty-message">Carregando serviços...</p>
    </div>
</main>

<div id="custom-confirm-modal" class="modal-overlay">
    <div class="modal-box">
        <h2 id="modal-titulo"></h2>
        <p id="modal-mensagem"></p>
        <div class="modal-botoes">
            <button id="modal-btn-cancelar">Cancelar</button>
            <button id="modal-btn-confirmar">Confirmar</button>
        </div>
    </div>
</div>

<script type="module">
    import { verificarAcesso } from './userService.js';

    async function carregarMenuEPainel() {
        try {
            const sessao = await verificarAcesso();

            if (!sessao || !sessao.user) {
                window.location.href = "login.html";
                return;
            }

            let papelUsuario = sessao.papeis || [];

            if (papelUsuario.length === 0) {
                if (sessao.isAdmin) papelUsuario.push('admin');
                if (sessao.isOwner) papelUsuario.push('dono');
                if (papelUsuario.length === 0) papelUsuario.push('funcionario');
            }

            const response = await fetch('menu-lateral.html');

            if (!response.ok) {
                throw new Error('menu-lateral.html não encontrado');
            }

            document.getElementById('menu-container').innerHTML = await response.text();

            const menuModule = await import('./menu-lateral.js');

            if (menuModule.ativarMenuLateral) {
                await menuModule.ativarMenuLateral(papelUsuario);
            }
        } catch (error) {
            console.error("Erro crítico ao inicializar a página de serviços:", error);

            document.querySelector('.main-content').innerHTML =
                '<h1 style="color:white;">Ocorreu um erro</h1><p style="color:white;">Não foi possível carregar a página. Tente novamente.</p>';
        }
    }

    carregarMenuEPainel();
</script>

<script src="./firebase-config.js" type="module"></script>
<script src="./vitrini-utils.js" type="module"></script>
<script src="./servicos.js" type="module"></script>

</body>
</html>
