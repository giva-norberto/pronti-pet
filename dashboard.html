<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Inteligente - Pronti</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --pet-roxo: #5522b6;
            --pet-roxo-2: #7140dc;
            --pet-roxo-escuro: #201042;
            --pet-amarelo: #ffc928;
            --pet-fundo: #f8f5ff;
            --pet-card: #ffffff;
            --pet-borda: #e7def8;
            --pet-texto: #17113d;
            --pet-muted: #726b86;
            --pet-verde: #16a34a;
            --pet-azul: #2563eb;
            --pet-laranja: #ea7b12;
            --pet-rosa: #c43c78;
            --shadow: 0 14px 34px rgba(32, 16, 66, .08);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            color: var(--pet-texto);
            background:
                radial-gradient(circle at 85% 3%, rgba(255, 201, 40, .13), transparent 22rem),
                radial-gradient(circle at 48% 8%, rgba(113, 64, 220, .11), transparent 24rem),
                linear-gradient(180deg, #fbfaff 0%, var(--pet-fundo) 100%);
            overflow-x: hidden;
        }

        #menu-container {
            width: 240px;
            min-width: 240px;
            min-height: 100vh;
            flex-shrink: 0;
        }

        .dashboard-main {
            flex: 1;
            width: 100%;
            max-width: 1280px;
            min-width: 0;
            margin: 0 auto;
            padding: 24px 28px 90px;
        }

        .dashboard-header {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 18px;
            margin-bottom: 18px;
            padding: 18px 20px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(255,255,255,.98), rgba(248,244,255,.98));
            border: 1px solid var(--pet-borda);
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .dashboard-header::after {
            content: "🐾";
            position: absolute;
            right: 118px;
            bottom: -20px;
            font-size: 4.2rem;
            opacity: .05;
            transform: rotate(-18deg);
            pointer-events: none;
        }

        .dashboard-header h1 {
            margin: 0;
            color: var(--pet-roxo-escuro);
            font-size: clamp(1.45rem, 2.4vw, 2rem);
            line-height: 1.1;
            font-weight: 900;
            letter-spacing: -.035em;
        }

        .dashboard-header h1::before {
            content: "📊";
            display: inline-grid;
            place-items: center;
            width: 44px;
            height: 44px;
            margin-right: 12px;
            border-radius: 14px;
            vertical-align: middle;
            font-size: 1.25rem;
            background: #f1eaff;
            box-shadow: inset 0 0 0 1px #dfd2fb;
        }

        .dashboard-actions {
            position: relative;
            z-index: 2;
        }

        .date-filter {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .date-filter::before {
            content: "073";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: var(--pet-roxo);
        }

        .date-filter input[type="date"] {
            min-height: 42px;
            padding: 9px 12px;
            border: 1px solid #ddd1fb;
            border-radius: 12px;
            outline: none;
            background: #fff;
            color: var(--pet-texto);
            font: 700 .82rem 'Poppins', sans-serif;
            box-shadow: 0 7px 18px rgba(32, 16, 66, .05);
        }

        .date-filter input[type="date"]:focus {
            border-color: var(--pet-roxo-2);
            box-shadow: 0 0 0 3px rgba(113, 64, 220, .12);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(290px, .8fr);
            gap: 18px;
            align-items: start;
        }

        .main-cards,
        .side-cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 0;
        }

        .kpi-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 13px;
        }

        .card {
            position: relative;
            overflow: hidden;
            padding: 20px;
            border: 1px solid var(--pet-borda);
            border-top: 4px solid var(--pet-roxo);
            border-radius: 18px;
            background: rgba(255,255,255,.98);
            box-shadow: 0 10px 25px rgba(32, 16, 66, .06);
        }

        .kpi-row .card:nth-child(1) {
            border-top-color: var(--pet-verde);
            background: linear-gradient(180deg, #f2fff6 0%, #ffffff 52%);
        }

        .kpi-row .card:nth-child(2) {
            border-top-color: var(--pet-azul);
            background: linear-gradient(180deg, #f1f6ff 0%, #ffffff 52%);
        }

        .kpi-row .card:nth-child(3) {
            border-top-color: var(--pet-amarelo);
            background: linear-gradient(180deg, #fff9e6 0%, #ffffff 52%);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 13px;
            color: var(--pet-muted);
            font-size: .8rem;
            font-weight: 800;
            line-height: 1.25;
        }

        .card-title i {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            border-radius: 11px;
            color: var(--pet-roxo);
            background: #f1eaff;
        }

        .kpi-row .card:nth-child(1) .card-title i {
            color: var(--pet-verde);
            background: #eafbed;
        }

        .kpi-row .card:nth-child(2) .card-title i {
            color: var(--pet-azul);
            background: #eaf2ff;
        }

        .kpi-row .card:nth-child(3) .card-title i {
            color: #c89200;
            background: #fff5d4;
        }

        .card-main-value {
            min-height: 42px;
            margin: 0;
            color: var(--pet-roxo-escuro);
            font-size: clamp(1.55rem, 2.6vw, 2.3rem);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -.035em;
        }

        .card-sub-value {
            margin-top: 8px;
            color: var(--pet-muted);
            font-size: .72rem;
            font-weight: 600;
        }

        .main-cards > .card {
            border-top-color: var(--pet-roxo);
            padding: 20px 20px 14px;
        }

        #grafico-container {
            min-height: 320px !important;
            max-height: 380px;
        }

        .resumo-card {
            min-height: 100%;
            border: none;
            padding: 22px;
            color: #fff;
            background:
                radial-gradient(circle at 88% 18%, rgba(255, 201, 40, .24), transparent 11rem),
                linear-gradient(145deg, #35106f 0%, #5522b6 57%, #793ae5 100%);
            box-shadow: 0 20px 46px rgba(85, 34, 182, .22);
        }

        .resumo-card::after {
            content: "🐶 🐱";
            position: absolute;
            right: 18px;
            bottom: 16px;
            padding: 11px 13px;
            border-radius: 18px;
            background: rgba(255,255,255,.11);
            border: 1px solid rgba(255,255,255,.13);
            font-size: 1.8rem;
            opacity: .9;
        }

        .resumo-card .card-title {
            position: relative;
            z-index: 2;
            color: #fff;
            font-size: .9rem;
        }

        .resumo-card .card-title i {
            color: #2b1558;
            background: var(--pet-amarelo);
        }

        #resumo-inteligente {
            position: relative;
            z-index: 2;
            padding-bottom: 72px;
            color: rgba(255,255,255,.91);
            font-size: .76rem;
            line-height: 1.65;
            font-weight: 500;
        }

        #resumo-inteligente ul {
            margin: 0;
            padding-left: 18px;
        }

        #resumo-inteligente li {
            margin-bottom: 7px;
        }

        .loading-spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(85, 34, 182, .15);
            border-top-color: var(--pet-roxo);
            border-radius: 50%;
            animation: spin .85s linear infinite;
        }

        .resumo-card .loading-spinner {
            border-color: rgba(255,255,255,.22);
            border-top-color: var(--pet-amarelo);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .erro {
            padding: 22px;
            border: 1px solid #fecaca;
            border-radius: 16px;
            color: #b91c1c;
            background: #fff;
            font-weight: 700;
        }

        /* Loading inicial curto; os cards continuam carregando individualmente. */
        #dashboard-loading {
            position: fixed;
            inset: 0;
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at 82% 12%, rgba(255, 201, 40, .13), transparent 18rem),
                radial-gradient(circle at 20% 80%, rgba(113, 64, 220, .12), transparent 20rem),
                linear-gradient(180deg, #fbfaff 0%, #f6f2fd 100%);
            transition: opacity .24s ease, visibility .24s ease;
        }

        body.loaded #dashboard-loading {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .dashboard-loading-card {
            width: min(350px, calc(100vw - 36px));
            padding: 25px 22px;
            text-align: center;
            border: 1px solid rgba(85, 34, 182, .14);
            border-radius: 23px;
            background: rgba(255,255,255,.97);
            box-shadow: 0 22px 55px rgba(32, 16, 66, .12);
        }

        .dashboard-loading-logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 14px;
            padding: 5px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: #fff;
            border: 1px solid rgba(85, 34, 182, .14);
            box-shadow: 0 10px 25px rgba(32, 16, 66, .14);
        }

        .dashboard-loading-logo img {
            width: 58px;
            height: 58px;
            object-fit: cover;
            border-radius: 15px;
            background: #000;
        }

        .dashboard-loading-card strong {
            display: block;
            color: var(--pet-roxo-escuro);
            font-size: 1rem;
            font-weight: 900;
        }

        .dashboard-loading-card span {
            display: block;
            margin: 5px 0 15px;
            color: var(--pet-muted);
            font-size: .7rem;
            line-height: 1.45;
        }

        .dashboard-loading-bar {
            height: 7px;
            overflow: hidden;
            border-radius: 999px;
            background: #eee8fa;
        }

        .dashboard-loading-bar::after {
            content: "";
            display: block;
            width: 42%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--pet-roxo), var(--pet-amarelo));
            animation: loadingMove 1s ease-in-out infinite;
        }

        @keyframes loadingMove {
            0% { transform: translateX(-110%); }
            100% { transform: translateX(260%); }
        }

        @media (max-width: 1080px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .resumo-card {
                min-height: 230px;
            }
        }

        @media (max-width: 992px) {
            body {
                display: block;
            }

            #menu-container {
                display: none;
                width: 0;
                min-width: 0;
                min-height: 0;
            }

            .dashboard-main {
                max-width: 900px;
                padding: 14px 12px 76px;
            }
        }

        @media (max-width: 720px) {
            .dashboard-header {
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 10px;
                margin-bottom: 12px;
                padding: 12px;
                border-radius: 16px;
            }

            .dashboard-header h1 {
                font-size: 1rem;
                white-space: nowrap;
            }

            .dashboard-header h1::before {
                width: 36px;
                height: 36px;
                margin-right: 8px;
                border-radius: 11px;
                font-size: .95rem;
            }

            .date-filter::before {
                display: none;
            }

            .date-filter input[type="date"] {
                width: 132px;
                min-height: 36px;
                padding: 7px 8px;
                border-radius: 10px;
                font-size: .66rem;
            }

            .dashboard-grid,
            .main-cards,
            .side-cards {
                gap: 10px;
            }

            .kpi-row {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 7px;
            }

            .card {
                padding: 11px 9px;
                border-radius: 14px;
            }

            .card-title {
                min-height: 34px;
                margin-bottom: 7px;
                gap: 5px;
                font-size: .54rem;
            }

            .card-title i {
                width: 27px;
                height: 27px;
                border-radius: 9px;
                font-size: .68rem;
            }

            .card-main-value {
                min-height: 27px;
                font-size: 1.08rem;
            }

            .card-sub-value {
                margin-top: 4px;
                font-size: .5rem;
            }

            .main-cards > .card {
                padding: 13px 11px 9px;
            }

            #grafico-container {
                min-height: 240px !important;
                max-height: 280px;
            }

            .resumo-card {
                min-height: 210px;
                padding: 15px;
            }

            .resumo-card::after {
                font-size: 1.35rem;
            }

            #resumo-inteligente {
                padding-bottom: 55px;
                font-size: .64rem;
                line-height: 1.55;
            }
        }

        @media (max-width: 390px) {
            .dashboard-main {
                padding-left: 8px;
                padding-right: 8px;
            }

            .dashboard-header h1 {
                font-size: .88rem;
            }

            .date-filter input[type="date"] {
                width: 119px;
            }

            .card-title {
                font-size: .49rem;
            }

            .card-main-value {
                font-size: .96rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .dashboard-loading-bar::after,
            .loading-spinner {
                animation-duration: 2s;
            }
        }
    </style>

</head>
<body>
    <div id="dashboard-loading" role="status" aria-live="polite">
        <div class="dashboard-loading-card">
            <div class="dashboard-loading-logo">
                <img
                    src="https://firebasestorage.googleapis.com/v0/b/pronti-pet.firebasestorage.app/o/logos%2Fpronti-pet%2Flogo-pronti-pet.png?alt=media&token=9e81c0bf-fe3e-4814-a8f5-a484312ff55b"
                    alt="Logo Pronti Pet"
                >
            </div>
            <strong>Preparando o painel</strong>
            <span>Carregando indicadores e informações do pet shop...</span>
            <div class="dashboard-loading-bar" aria-hidden="true"></div>
        </div>
    </div>

    <div id="menu-container"></div>

    <main class="dashboard-main">
        <div class="dashboard-header">
            <h1>Painel Inteligente</h1>
            <div class="dashboard-actions">
                <div class="date-filter">
                    <input type="date" id="filtro-data">
                </div>
            </div>
        </div>
        <div class="dashboard-grid">
            <div class="main-cards">
                <div class="kpi-row">
                    <div class="card">
                        <div class="card-title"><i class="fa-solid fa-dollar-sign"></i> Faturamento (Dia)</div>
                        <div class="card-main-value" id="faturamento-realizado"><span class="loading-spinner"></span></div>
                        <div class="card-sub-value">Previsto: <span id="faturamento-previsto">--</span></div>
                    </div>
                    <div class="card">
                        <div class="card-title"><i class="fa-solid fa-calendar-check"></i> Agendamentos (Dia)</div>
                        <div class="card-main-value" id="total-agendamentos-dia"><span class="loading-spinner"></span></div>
                        <div class="card-sub-value"><span id="agendamentos-pendentes">--</span> pendentes</div>
                    </div>
                    <div class="card">
                        <div class="card-title"><i class="fa-solid fa-chart-line"></i> Faturamento (Mês)</div>
                        <div class="card-main-value" id="faturamento-mensal"><span class="loading-spinner"></span></div>
                        <div class="card-sub-value"><span id="agendamentos-mes">--</span> agendamentos</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-title"><i class="fa-solid fa-chart-simple"></i> Serviços mais vendidos (Mês)</div>
                    <div id="grafico-container" style="position: relative; min-height: 320px;">
                        <canvas id="servicos-mais-vendidos"></canvas>
                    </div>
                </div>
            </div>
            <div class="side-cards">
                <div class="card resumo-card">
                    <div class="card-title"><i class="fa-solid fa-lightbulb"></i> Resumo Inteligente</div>
                    <div id="resumo-inteligente">
                        <span class="loading-spinner"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module">
        import { verificarAcesso } from './userService.js';
        import { inicializarDashboard } from './dashboard.js';

        async function carregarMenu(papelUsuario ) {
            try {
                const response = await fetch('menu-lateral.html');
                if (!response.ok) throw new Error('menu-lateral.html não encontrado');
                document.getElementById('menu-container').innerHTML = await response.text();

                try {
                  const menuModule = await import('./menu-lateral.js');
                  if (menuModule.ativarMenuLateral) {
                      await menuModule.ativarMenuLateral(papelUsuario);
                  }
                } catch (e) {
                  console.debug('menu-lateral.js não encontrado ou sem ativarMenuLateral');
                }
            } catch (error) {
                console.error("Falha ao carregar o menu lateral:", error);
            }
        }

        async function inicializarPagina() {
            try {
                const sessao = await verificarAcesso();
                if (!sessao || !sessao.user) return;

                let papelUsuario = sessao.papeis || [];
                if (papelUsuario.length === 0) {
                    if (sessao.isOwner) papelUsuario.push('dono');
                    else if (sessao.isAdmin) papelUsuario.push('admin');
                    else papelUsuario.push('funcionario');
                }
                if (!Array.isArray(papelUsuario)) papelUsuario = [papelUsuario];

                document.body.classList.add('loaded');

                await Promise.all([
                    carregarMenu(papelUsuario),
                    inicializarDashboard(sessao)
                ]);
            } catch (error) {
                console.error("Erro crítico ao inicializar a página do dashboard:", error);
                document.querySelector('.dashboard-main').innerHTML = '<p class="erro">Ocorreu um erro crítico. Tente recarregar a página.</p>';
            } finally {
                document.body.classList.add('loaded');
            }
        }

        inicializarPagina();
    </script>
</body>
</html>
