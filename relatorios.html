<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios - Pronti Pet</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
:root {
    --cor-primaria: #5522b6;
    --cor-secundaria: #7140dc;
    --cor-sucesso: #16a34a;
    --cor-cinza: #726b86;
    --cor-texto-escuro: #17113d;
    --cor-fundo-app: #f8f5ff;

    --pet-roxo: #5522b6;
    --pet-roxo-2: #7140dc;
    --pet-roxo-escuro: #201042;
    --pet-amarelo: #ffc928;
    --pet-card: #ffffff;
    --pet-borda: #e7def8;
    --pet-muted: #726b86;
}

/* Mantém todas as classes e seletores usados pela tela atual. */
*, *::before, *::after {
    box-sizing: border-box;
}

html,
body {
    min-height: 100vh !important;
    margin: 0 !important;
    padding: 0 !important;
    font-family: 'Inter', 'Poppins', Arial, sans-serif !important;
    color: var(--cor-texto-escuro);
    background:
        radial-gradient(circle at 90% 4%, rgba(255, 201, 40, .14), transparent 22rem),
        radial-gradient(circle at 14% 88%, rgba(113, 64, 220, .11), transparent 24rem),
        linear-gradient(180deg, #fbfaff 0%, var(--cor-fundo-app) 100%) !important;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
}

.main-relatorios {
    width: min(1100px, calc(100% - 32px));
    min-width: 0;
    min-height: calc(100vh - 32px);
    margin: 16px auto;
    padding: 14px;
    overflow: visible;
    border: 1px solid var(--pet-borda);
    border-radius: 22px;
    background:
        radial-gradient(circle at 100% 0%, rgba(255, 201, 40, .08), transparent 14rem),
        var(--pet-card);
    box-shadow: 0 18px 44px rgba(32, 16, 66, .09);
}

.top-actions {
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 14px;
    border-radius: 16px;
    color: #fff;
    background:
        radial-gradient(circle at 90% 20%, rgba(255, 201, 40, .22), transparent 10rem),
        linear-gradient(135deg, var(--pet-roxo) 0%, var(--pet-roxo-2) 100%);
}

.top-actions::after {
    content: "🐾";
    position: absolute;
    right: 20px;
    bottom: -20px;
    font-size: 4.8rem;
    opacity: .08;
    transform: rotate(-18deg);
    pointer-events: none;
}

.btn-voltar {
    position: relative;
    z-index: 1;
    min-height: 38px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
    padding: 8px 13px;
    border: 0;
    border-radius: 11px;
    background: #fff;
    color: var(--pet-roxo);
    font-size: .86rem;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(32, 16, 66, .14);
}

.btn-voltar .btn-text {
    display: inline;
}

.abas-container {
    position: relative;
    z-index: 1;
    min-width: 0;
    flex: 1 1 520px;
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    padding: 3px;
    overflow-x: auto;
    border: 0;
    border-radius: 12px;
    background: rgba(255, 255, 255, .12);
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
}

.abas-container::-webkit-scrollbar {
    display: none;
}

.aba {
    min-width: max-content;
    min-height: 36px;
    flex-shrink: 0;
    padding: 7px 11px;
    border: 1px solid transparent;
    border-radius: 9px;
    outline: none;
    background: transparent;
    color: rgba(255,255,255,.86);
    font-size: .76rem;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    scroll-snap-align: start;
    transition: background .18s ease, color .18s ease;
}

.aba:not(.active):hover {
    background: rgba(255,255,255,.13);
    color: #fff;
}

.aba.active {
    z-index: 2;
    border-color: rgba(255,255,255,.45);
    background: var(--pet-amarelo);
    color: var(--pet-roxo-escuro);
    box-shadow: 0 6px 15px rgba(32,16,66,.16);
}

.filtros-relatorio,
.filtros-relatorios {
    display: grid;
    grid-template-columns: repeat(3, minmax(150px, 1fr)) auto;
    align-items: end;
    gap: 10px;
    margin: 14px 0 10px;
    padding: 13px;
    border: 1px solid var(--pet-borda);
    border-radius: 15px;
    background: #fbf9ff;
    box-shadow: none;
}

.filtros-relatorio label,
.filtros-relatorios label {
    display: block;
    margin: 0 0 5px;
    color: var(--pet-muted);
    font-size: .72rem;
    font-weight: 700;
}

.filtros-relatorio input,
.filtros-relatorio select,
.filtros-relatorios input,
.filtros-relatorios select {
    width: 100%;
    min-width: 0;
    max-width: none;
    min-height: 40px;
    padding: 8px 10px;
    border: 1px solid var(--pet-borda);
    border-radius: 10px;
    background: #fff;
    color: var(--cor-texto-escuro);
    font-family: inherit;
    font-size: .8rem;
    outline: none;
}

.filtros-relatorio input:focus,
.filtros-relatorio select:focus,
.filtros-relatorios input:focus,
.filtros-relatorios select:focus {
    border-color: var(--pet-roxo-2);
    box-shadow: 0 0 0 4px rgba(113, 64, 220, .11);
}

#btn-aplicar-filtro {
    min-height: 40px;
    padding: 8px 14px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--pet-roxo), var(--pet-roxo-2));
    color: #fff;
    font-family: inherit;
    font-size: .78rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(85,34,182,.17);
}

.aba-conteudo {
    display: none;
    width: 100%;
    min-width: 0;
    min-height: 170px;
    margin: 12px 0 0;
    padding: 14px;
    overflow: visible;
    border: 1px solid var(--pet-borda);
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 8px 22px rgba(32, 16, 66, .055);
    animation: fadeIn .22s;
}

.aba-conteudo.active {
    display: block;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--pet-borda);
    border-radius: 14px;
    background: #fff;
}

.aba-conteudo table {
    width: 100%;
    min-width: 720px;
    margin: 0;
    overflow: hidden;
    border-collapse: collapse;
    border-spacing: 0;
    border-radius: 0;
    background: #fff;
    box-shadow: none;
    font-size: .86rem;
}

.aba-conteudo th,
.aba-conteudo td {
    padding: 10px 11px !important;
    border-bottom: 1px solid #eee8f8;
    background: #fff !important;
    color: var(--cor-texto-escuro);
    text-align: left;
    vertical-align: top;
    font-weight: 400;
}

.aba-conteudo th {
    background: #f1eaff !important;
    color: var(--pet-roxo-escuro);
    font-size: .76rem;
    font-weight: 800;
    white-space: nowrap;
}

.aba-conteudo tr:last-child td {
    border-bottom: 0;
}

.aba-conteudo tr:hover td {
    background: #fbf8ff !important;
}

.aba-conteudo p {
    margin: 10px 0;
    color: var(--pet-muted);
    font-size: .86rem;
    text-align: center;
}

.btn-exportar-csv {
    min-width: 0 !important;
    min-height: 38px !important;
    height: auto !important;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin: 0 0 13px !important;
    padding: 8px 13px !important;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, #16a34a, #22c55e);
    color: #fff;
    font-family: inherit;
    font-size: .74rem !important;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 7px 17px rgba(22,163,74,.16);
}

/* Tablet */
@media (max-width: 900px) {
    .main-relatorios {
        width: calc(100% - 20px);
        min-height: calc(100vh - 20px);
        margin: 10px auto;
        padding: 10px;
        border-radius: 18px;
    }

    .top-actions {
        align-items: stretch;
        padding: 11px;
    }

    .btn-voltar {
        align-self: flex-start;
    }

    .abas-container {
        flex-basis: 100%;
        width: 100%;
    }

    .filtros-relatorio,
    .filtros-relatorios {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 10px;
    }

    #btn-aplicar-filtro {
        width: 100%;
    }

    .aba-conteudo {
        padding: 11px;
        border-radius: 14px;
    }
}

/* Celular: tabela vira cartões, sem largura forçada. */
@media (max-width: 600px) {
    html,
    body {
        width: 100%;
        overflow-x: hidden;
    }

    .main-relatorios {
        width: calc(100% - 12px);
        margin: 6px auto;
        padding: 7px;
        border-radius: 15px;
    }

    .top-actions {
        gap: 8px;
        padding: 9px;
        border-radius: 13px;
    }

    .btn-voltar {
        min-height: 35px;
        padding: 7px 10px;
        font-size: .78rem;
    }

    .abas-container {
        gap: 5px;
        padding: 2px;
    }

    .aba {
        min-height: 34px;
        padding: 6px 9px;
        font-size: .69rem;
    }

    .filtros-relatorio,
    .filtros-relatorios {
        grid-template-columns: 1fr;
        margin: 10px 0 8px;
        padding: 9px;
        border-radius: 12px;
    }

    .filtros-relatorio input,
    .filtros-relatorio select,
    .filtros-relatorios input,
    .filtros-relatorios select {
        min-height: 39px;
        font-size: .78rem;
    }

    .aba-conteudo {
        margin-top: 8px;
        padding: 8px;
        border: 0;
        border-radius: 0;
        box-shadow: none;
    }

    .table-wrapper {
        overflow: visible !important;
        border: 0;
        border-radius: 0;
        background: transparent;
    }

    .aba-conteudo table,
    .aba-conteudo thead,
    .aba-conteudo tbody,
    .aba-conteudo tr,
    .aba-conteudo th,
    .aba-conteudo td {
        display: block;
        width: 100%;
        min-width: 0;
    }

    .aba-conteudo table {
        min-width: 0 !important;
        background: transparent;
    }

    .aba-conteudo thead {
        display: none;
    }

    .aba-conteudo tbody {
        display: grid;
        gap: 10px;
    }

    .aba-conteudo tr {
        overflow: hidden;
        margin: 0;
        padding: 0;
        border: 1px solid var(--pet-borda);
        border-top: 4px solid var(--pet-roxo);
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 7px 18px rgba(32, 16, 66, .055);
    }

    .aba-conteudo td {
        min-height: 42px;
        display: grid;
        grid-template-columns: minmax(105px, 42%) minmax(0, 1fr);
        align-items: start;
        gap: 9px;
        padding: 9px 11px !important;
        border: 0;
        border-bottom: 1px dashed #eee8f8;
        font-size: .76rem;
        overflow-wrap: anywhere;
    }

    .aba-conteudo tr td:last-child {
        border-bottom: 0;
    }

    .aba-conteudo td::before {
        content: attr(data-label);
        min-width: 0;
        margin: 0;
        color: var(--pet-roxo);
        font-size: .69rem;
        font-weight: 800;
        line-height: 1.35;
    }

    .btn-exportar-csv {
        width: 100%;
        min-height: 40px !important;
        margin-bottom: 10px !important;
    }
}

@media (max-width: 420px) {
    .btn-voltar .btn-text {
        display: none;
    }

    .btn-voltar {
        width: 36px;
        min-width: 36px;
        justify-content: center;
        padding: 0;
    }

    .aba {
        padding: 6px 8px;
        font-size: .66rem;
    }

    .aba-conteudo td {
        grid-template-columns: minmax(92px, 40%) minmax(0, 1fr);
        gap: 7px;
        padding: 8px 9px !important;
        font-size: .72rem;
    }

    .aba-conteudo td::before {
        font-size: .65rem;
    }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
}

  </style>
</head>
<body>
  <div id="page-content">
    <main class="main-relatorios">
      <div class="top-actions">
        <button id="btn-voltar" class="btn-voltar">
          <i class="fa fa-arrow-left" aria-hidden="true"></i>
          <span class="btn-text">Voltar</span>
        </button>

        <nav class="abas-container" role="tablist" aria-label="Abas de relatórios">
          <button class="aba active" data-aba="servicos"><i class="fa-solid fa-gears" aria-hidden="true"></i> Serviços</button>
          <button class="aba" data-aba="profissionais"><i class="fa-solid fa-user-tie" aria-hidden="true"></i> Profissionais</button>
          <button class="aba" data-aba="faturamento"><i class="fa-solid fa-coins" aria-hidden="true"></i> Faturamento</button>
          <button class="aba" data-aba="clientes"><i class="fa-solid fa-user-group" aria-hidden="true"></i> Clientes</button>
          <button class="aba" data-aba="agenda"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i> Agenda</button>
          <button class="aba" data-aba="comissao"><i class="fa-solid fa-percent" aria-hidden="true"></i> Comissão</button>
        </nav>
      </div>

      <header class="filtros-relatorios" role="region" aria-label="Filtros de relatórios">
        <label for="filtro-data-inicio">Data Início:</label>
        <input type="date" id="filtro-data-inicio">

        <label for="filtro-data-fim">Data Fim:</label>
        <input type="date" id="filtro-data-fim">

        <label for="filtro-profissional">Profissional:</label>
        <select id="filtro-profissional">
          <option value="todos">Todos</option>
        </select>

        <button id="btn-aplicar-filtro"><i class="fa-solid fa-filter" aria-hidden="true"></i> Aplicar</button>
      </header>

      <section class="conteudo-abas" id="conteudo-abas">
        <div class="aba-conteudo active" id="servicos" role="tabpanel"></div>
        <div class="aba-conteudo" id="profissionais" role="tabpanel"></div>
        <div class="aba-conteudo" id="faturamento" role="tabpanel"></div>
        <div class="aba-conteudo" id="clientes" role="tabpanel"></div>
        <div class="aba-conteudo" id="agenda" role="tabpanel"></div>
        <div class="aba-conteudo" id="comissao" role="tabpanel"></div>
      </section>
    </main>
  </div>

  <script type="module">
    import { verificarAcesso } from './userService.js';
    import { db } from './firebase-config.js';
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    async function inicializarPagina() {
      try {
        const sessao = await verificarAcesso();
        if (!sessao || !sessao.user) return;

        let papelUsuario = sessao.papeis || [];
        if (papelUsuario.length === 0) {
          if (sessao.isAdmin) papelUsuario.push('admin');
          if (sessao.isOwner) papelUsuario.push('dono');
          if (papelUsuario.length === 0) papelUsuario.push('funcionario');
        }

        const permissoesRef = doc(db, "configuracoesGlobais", "permissoes");
        const permissoesSnap = await getDoc(permissoesRef);
        const regras = permissoesSnap.exists() ? permissoesSnap.data() : {};

        const podeVer = papelUsuario.some(papel => regras.relatorios && regras.relatorios[papel] === true);
        if (!podeVer) {
          document.getElementById('page-content').innerHTML = `
            <div style="background: #fff; padding: 40px; border-radius: 12px; text-align: center; margin-top: 50px;">
              <h1>Acesso Negado</h1>
              <p>Você não tem permissão para acessar esta página.</p>
              <button onclick="window.history.back()" style="margin-top: 20px; padding: 10px 20px; cursor: pointer;">Voltar</button>
            </div>
          `;
          return;
        }
      } catch (error) {
        console.error("Erro crítico ao inicializar a página de relatórios:", error);
        document.getElementById('page-content').innerHTML = '<h1>Ocorreu um erro</h1><p>Não foi possível carregar a página. Tente novamente.</p>';
      }
    }

    inicializarPagina();
  </script>

  <script src="relatorios.js" type="module"></script>

  <script type="module">
    import { verificarAcesso } from './userService.js';
    import { db } from './firebase-config.js';
    import {
      collection, query, where, getDocs, doc, getDoc, orderBy, Timestamp
    } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    const OK_STATUS = ['concluido','concluídos','concluidos','finalizado','finalizado','completed','done'];

    function fmtBRL(v) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(v || 0));
    }

    if (typeof window.safeVerificarAcesso === 'undefined') {
      window.safeVerificarAcesso = async function(maxRetries = 6, baseDelayMs = 120) {
        let attempt = 0;
        while (attempt < maxRetries) {
          try { return await verificarAcesso(); }
          catch (err) {
            const msg = (err && err.message) ? err.message.toString().toLowerCase() : '';
            if (msg.includes('race condition') || msg.includes('race condition detectada')) {
              attempt++;
              const delay = baseDelayMs * attempt;
              console.warn(`[comissao] verificarAcesso: retry ${attempt}/${maxRetries} em ${delay}ms`);
              await new Promise(r => setTimeout(r, delay));
              continue;
            }
            throw err;
          }
        }
        throw new Error('safeVerificarAcesso: esgotadas tentativas por race condition.');
      };
    }
    const safeVerificarAcesso = window.safeVerificarAcesso;

    async function fetchConcludedAppointments(empresaId, fromDate, toDate) {
      let fromTs = null, toTs = null;
      try {
        if (fromDate) fromTs = Timestamp.fromDate(new Date(fromDate + 'T00:00:00'));
        if (toDate) {
          const d = new Date(toDate + 'T23:59:59');
          toTs = Timestamp.fromDate(d);
        }
      } catch (e) {
        console.warn('[comissao] erro parse datas', e);
      }

      const candidates = ['agendamentos', 'agenda', 'bookings', 'appointments'];
      for (const col of candidates) {
        try {
          const colRef = collection(db, col);
          const filters = [ where('empresaId', '==', empresaId) ];
          if (fromTs) filters.push(where('data', '>=', fromTs));
          if (toTs) filters.push(where('data', '<=', toTs));
          let q;
          try {
            q = query(colRef, ...filters, orderBy('data', 'desc'));
          } catch (errQ) {
            q = query(colRef, ...filters);
          }
          const snap = await getDocs(q);
          if (!snap.empty) {
            const results = [];
            snap.docs.forEach(d => {
              const data = d.data();
              const status = (data.status || data.estado || '').toString().toLowerCase();
              const concluded = (status && OK_STATUS.includes(status)) || (typeof data.concluido !== 'undefined' && Boolean(data.concluido));
              if (concluded) {
                results.push({
                  id: d.id,
                  raw: data,
                  preco: Number(data.preco || data.valor || data.price || data.fee || 0),
                  profissionalId: data.profissionalId || data.profissional || data.employeeId || data.professionalId || null,
                  serviceId: data.serviceId || data.servicoId || data.servico || data.service || null
                });
              }
            });
            return results;
          }
        } catch (err) {
          console.warn('[comissao] fetch try', col, 'erro', err);
        }
      }
      return [];
    }

    async function getProfessional(empresaId, profissionalId) {
      if (!profissionalId) return null;
      try {
        const ref = doc(db, 'empresarios', empresaId, 'profissionais', profissionalId);
        const snap = await getDoc(ref);
        return snap && snap.exists() ? snap.data() : null;
      } catch (err) {
        console.warn('[comissao] getProfessional erro', err);
        return null;
      }
    }

    function calcCommissionForAppointment(preco, profData, serviceId) {
      let commissionPct = 0;
      if (profData) {
        if (profData.comissaoPorServico && serviceId && typeof profData.comissaoPorServico[serviceId] !== 'undefined') {
          commissionPct = Number(profData.comissaoPorServico[serviceId]) || 0;
        } else if (typeof profData.comissaoPadrao === 'number') {
          commissionPct = Number(profData.comissaoPadrao) || 0;
        }
      }
      const employeeAmount = Number((preco * (commissionPct / 100)).toFixed(2));
      const ownerAmount = Number((preco - employeeAmount).toFixed(2));
      return { commissionPct, employeeAmount, ownerAmount };
    }

    function renderComissaoTable(aggregates, container) {
      container.innerHTML = '';
      if (!aggregates || aggregates.length === 0) {
        container.innerHTML = '<div style="padding:18px;color:#6b7280">Nenhum dado para exibir no período selecionado.</div>';
        return;
      }

      const table = document.createElement('table');
      table.style.width = '100%';
      table.style.borderCollapse = 'collapse';

      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      ['Profissional', 'Valor faturado', 'Comissão % (média ponderada)', 'Valor funcionário', 'Valor líquido (dono)'].forEach(h => {
        const th = document.createElement('th');
        th.textContent = h;
        th.style.padding = '10px 8px';
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      let totalFaturado = 0, totalFuncionario = 0, totalLiquido = 0;

      aggregates.forEach(row => {
        totalFaturado += row.totalFaturado;
        totalFuncionario += row.totalFuncionario;
        totalLiquido += row.totalLiquido;

        const tr = document.createElement('tr');
        const cell = (txt) => {
          const td = document.createElement('td');
          td.textContent = txt;
          td.style.padding = '8px';
          return td;
        };

        tr.appendChild(cell(row.profissionalNome || '(sem nome)'));
        tr.appendChild(cell(fmtBRL(row.totalFaturado)));
        tr.appendChild(cell((row.avgCommissionPct || 0).toFixed(2) + ' %'));
        tr.appendChild(cell(fmtBRL(row.totalFuncionario)));
        tr.appendChild(cell(fmtBRL(row.totalLiquido)));

        tbody.appendChild(tr);
      });

      table.appendChild(tbody);

      const tfoot = document.createElement('tfoot');
      const fr = document.createElement('tr');
      fr.style.fontWeight = '700';
      fr.style.background = '#f3f4fc';
      const emptyTd = () => { const td = document.createElement('td'); td.style.padding = '8px'; return td; };
      fr.appendChild(emptyTd());
      const tdTotalFaturado = document.createElement('td'); tdTotalFaturado.textContent = fmtBRL(totalFaturado); tdTotalFaturado.style.padding='8px';
      fr.appendChild(tdTotalFaturado);
      fr.appendChild((() => { const td=document.createElement('td'); td.textContent='TOTAIS:'; td.style.padding='8px'; return td; })());
      const tdTotalFuncionario = document.createElement('td'); tdTotalFuncionario.textContent = fmtBRL(totalFuncionario); tdTotalFuncionario.style.padding='8px';
      fr.appendChild(tdTotalFuncionario);
      const tdTotalLiquido = document.createElement('td'); tdTotalLiquido.textContent = fmtBRL(totalLiquido); tdTotalLiquido.style.padding='8px';
      fr.appendChild(tdTotalLiquido);
      tfoot.appendChild(fr);
      table.appendChild(tfoot);

      container.appendChild(table);
    }

    async function populateComissaoTab() {
      try {
        const sess = await safeVerificarAcesso();
        if (!sess || !sess.empresaId) {
          console.error('[comissao] sessão inválida');
          return;
        }
        const empresaId = sess.empresaId;
        const from = document.getElementById('filtro-data-inicio').value;
        const to = document.getElementById('filtro-data-fim').value;
        const profFilter = document.getElementById('filtro-profissional').value;

        const container = document.getElementById('comissao');
        container.innerHTML = '<div style="padding:16px;color:#6b7280">Carregando relatório de comissões...</div>';

        const appts = await fetchConcludedAppointments(empresaId, from, to);

        const map = new Map();
        for (const a of appts) {
          const pid = a.profissionalId || '(sem)';
          if (profFilter && profFilter !== 'todos' && pid !== profFilter) continue;
          const profData = await getProfessional(empresaId, pid);
          const serviceId = a.serviceId;
          const preco = Number(a.preco || 0);
          const { commissionPct, employeeAmount, ownerAmount } = calcCommissionForAppointment(preco, profData, serviceId);

          const cur = map.get(pid) || { totalFaturado:0, totalFuncionario:0, totalLiquido:0, profissionalNome: (profData && (profData.nome || profData.name)) || pid, commissionWeightSum:0 };
          cur.totalFaturado += preco;
          cur.totalFuncionario += employeeAmount;
          cur.totalLiquido += ownerAmount;
          cur.commissionWeightSum += employeeAmount;
          map.set(pid, cur);
        }

        const aggregates = Array.from(map.entries()).map(([pid, v]) => {
          const avgCommissionPct = v.totalFaturado > 0 ? (v.commissionWeightSum / v.totalFaturado) * 100 : 0;
          return {
            profissionalId: pid,
            profissionalNome: v.profissionalNome,
            totalFaturado: Number(v.totalFaturado.toFixed(2)),
            totalFuncionario: Number(v.totalFuncionario.toFixed(2)),
            totalLiquido: Number(v.totalLiquido.toFixed(2)),
            avgCommissionPct: Number(avgCommissionPct.toFixed(2))
          };
        }).sort((a,b) => b.totalFaturado - a.totalFaturado);

        renderComissaoTable(aggregates, container);
      } catch (err) {
        console.error('[comissao] erro populateComissaoTab', err);
        const container = document.getElementById('comissao');
        if (container) container.innerHTML = '<div style="padding:18px;color:#a00">Erro ao gerar relatório de comissões. Veja console.</div>';
      }
    }

    window.populateComissaoTab = populateComissaoTab;

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.aba').forEach(btn => {
        if (btn.dataset.aba === 'comissao') {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.aba').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.aba-conteudo').forEach(c => c.classList.remove('active'));
            const el = document.getElementById('comissao');
            if (el) el.classList.add('active');
            populateComissaoTab();
          });
        }
      });

      const btnAplicar = document.getElementById('btn-aplicar-filtro');
      if (btnAplicar) {
        btnAplicar.addEventListener('click', () => {
          const active = document.querySelector('.aba.active');
          if (active && active.dataset.aba === 'comissao') {
            populateComissaoTab();
          }
        });
      }
    });
  </script>

  <script>
    const btnVoltar = document.getElementById("btn-voltar");
    if (btnVoltar) {
      btnVoltar.addEventListener("click", () => {
        window.history.back();
      });
    }

    if (window.history.state === null || window.history.state.page !== "relatorios") {
      window.history.pushState({ "page": "relatorios" }, "");
    }
    window.addEventListener('popstate', function() {
      window.location.replace('index.html');
    });
  </script>
</body>
</html>
