<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manual do Cliente - Pronti Pet</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --pet-roxo: #5522b6;
      --pet-roxo-2: #7140dc;
      --pet-roxo-escuro: #201042;
      --pet-amarelo: #ffc928;
      --pet-fundo: #f8f5ff;
      --pet-card: #ffffff;
      --pet-texto: #17113d;
      --pet-muted: #726b86;
      --pet-borda: #e7def8;
      --pet-sombra: 0 18px 42px rgba(32, 16, 66, .10);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--pet-texto);
      line-height: 1.6;
      background:
        radial-gradient(circle at 100% 0%, rgba(255, 201, 40, .15), transparent 22rem),
        radial-gradient(circle at 8% 18%, rgba(113, 64, 220, .12), transparent 24rem),
        linear-gradient(180deg, #fbfaff 0%, var(--pet-fundo) 100%);
      background-attachment: fixed;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 260px;
      min-height: 100vh;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      padding: 22px 18px;
      color: #fff;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 201, 40, .14), transparent 14rem),
        linear-gradient(180deg, var(--pet-roxo) 0%, var(--pet-roxo-2) 100%);
      box-shadow: 4px 0 24px rgba(32, 16, 66, .17);
    }

    .sidebar-brand {
      display: block;
      padding: 0 28px 12px;
      margin-bottom: 8px;
      text-align: center;
      text-decoration: none;
    }

    .sidebar-brand img {
      width: 100%;
      max-width: 148px;
      min-height: 50px;
      display: block;
      margin: 0 auto;
      object-fit: contain;
      padding: 7px;
      border: 3px solid rgba(255, 201, 40, .95);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(32, 16, 66, .20);
    }

    .sidebar hr {
      margin: 0 10px 17px;
      border: 0;
      border-top: 1px solid rgba(255,255,255,.20);
    }

    .menu-title {
      margin: 0 7px 12px;
      color: rgba(255,255,255,.86);
      font-size: .7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .11em;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex-grow: 1;
      overflow-y: auto;
      padding: 0 0 16px;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.34) transparent;
    }

    .nav-menu::-webkit-scrollbar {
      width: 7px;
    }

    .nav-menu::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.34);
      border-radius: 999px;
    }

    .nav-item {
      width: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 14px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 12px;
      background: rgba(255,255,255,.96);
      color: var(--pet-roxo);
      font: 700 .9rem 'Inter', sans-serif;
      text-decoration: none;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(32, 16, 66, .08);
      transition: .18s ease;
    }

    .nav-item span {
      width: 21px;
      min-width: 21px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-item:hover:not(.active) {
      transform: translateX(3px);
      border-color: rgba(255,201,40,.8);
      background: #fbf8ff;
      color: var(--pet-roxo-escuro);
    }

    .nav-item.active,
    .nav-item:focus-visible {
      background: linear-gradient(135deg, var(--pet-amarelo), #ffd84f);
      color: var(--pet-roxo-escuro);
      border-color: rgba(255,255,255,.9);
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(32,16,66,.18);
      outline: none;
    }

    .content {
      width: calc(100% - 260px);
      max-width: 1180px;
      margin-left: 260px;
      padding: 34px;
    }

    .manual-card {
      position: relative;
      overflow: hidden;
      min-height: 420px;
      padding: 34px;
      border: 1px solid var(--pet-borda);
      border-top: 5px solid var(--pet-amarelo);
      border-radius: 24px;
      background:
        radial-gradient(circle at 100% 0%, rgba(255,201,40,.11), transparent 12rem),
        linear-gradient(180deg, #ffffff 0%, #fbf9ff 100%);
      box-shadow: var(--pet-sombra);
    }

    .manual-card::after {
      content: "🐾";
      position: absolute;
      right: 24px;
      bottom: -20px;
      font-size: 6rem;
      opacity: .06;
      transform: rotate(-15deg);
      pointer-events: none;
    }

    .badge {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 16px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #f1eaff;
      color: var(--pet-roxo);
      font-size: .75rem;
      font-weight: 800;
    }

    .badge::before {
      content: "🐾";
      font-size: .78rem;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin-bottom: 18px;
      color: var(--pet-roxo-escuro);
      font-size: clamp(1.8rem, 4vw, 2.45rem);
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: -.04em;
    }

    .text-content {
      position: relative;
      z-index: 1;
      margin-bottom: 30px;
      color: #4a4458;
      font-size: 1rem;
      line-height: 1.72;
      white-space: pre-wrap;
    }

    .image-container {
      position: relative;
      z-index: 1;
      width: 100%;
      overflow: hidden;
      display: none;
      border: 1px solid var(--pet-borda);
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(32,16,66,.08);
    }

    .image-container img {
      width: 100%;
      display: block;
    }

    .loading {
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--pet-muted);
      font-weight: 700;
      text-align: center;
    }

    @media (max-width: 850px) {
      body {
        background-attachment: scroll;
      }

      .app {
        flex-direction: column;
      }

      .sidebar {
        position: relative;
        width: 100%;
        min-height: auto;
        padding: 14px;
      }

      .sidebar-brand {
        padding: 0 0 10px;
      }

      .sidebar-brand img {
        max-width: 105px;
      }

      .sidebar hr {
        margin-bottom: 12px;
      }

      .nav-menu {
        display: flex;
        flex-direction: row;
        gap: 8px;
        overflow-x: auto;
        overflow-y: hidden;
        padding-bottom: 6px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }

      .nav-menu::-webkit-scrollbar {
        display: none;
      }

      .nav-item {
        flex: 0 0 auto;
        width: auto;
        min-width: 126px;
        white-space: nowrap;
        justify-content: center;
      }

      .content {
        width: 100%;
        max-width: none;
        margin-left: 0;
        padding: 14px;
      }

      .manual-card {
        min-height: 340px;
        padding: 22px 18px;
        border-radius: 20px;
      }

      h1 {
        font-size: 1.55rem;
      }

      .text-content {
        font-size: .93rem;
      }
    }

    @media (max-width: 480px) {
      .sidebar-brand img {
        max-width: 92px;
      }

      .nav-item {
        min-width: 116px;
        min-height: 40px;
        padding: 9px 11px;
        font-size: .8rem;
      }

      .manual-card {
        padding: 20px 15px;
      }
    }
  </style>
</head>
<body>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a href="../index.html" class="sidebar-brand">
        <img src="https://firebasestorage.googleapis.com/v0/b/pronti-pet.firebasestorage.app/o/logos%2Fpronti-pet%2Flogo-pronti-pet.png?alt=media&token=9e81c0bf-fe3e-4814-a8f5-a484312ff55b"
             alt="Logo Pronti Pet" id="sidebar-logo">
      </a>

      <hr />

      <div class="menu-title">Tópicos de Ajuda</div>

      <nav class="nav-menu" id="nav-menu">
        <div class="loading">Carregando tópicos...</div>
      </nav>
    </aside>

    <main class="content">
      <div id="manual-view" class="manual-card">
        <div class="loading">Carregando informações...</div>
      </div>
    </main>
  </div>

  <script type="module">
    import { db } from "../firebase-config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    const COLECAO_MANUAL = "manual_global";
    const viewContainer = document.getElementById("manual-view");
    const navMenu = document.getElementById("nav-menu");

    const SECOES_MANUAL = [
      { id: "inicio", nome: "Início", icon: "fa-house" },
      { id: "login", nome: "Login e acesso", icon: "fa-user-lock" },
      { id: "empresa", nome: "Empresa", icon: "fa-building" },
      { id: "dashboard", nome: "Dashboard", icon: "fa-chart-pie" },
      { id: "agenda", nome: "Agenda", icon: "fa-calendar-days" },
      { id: "equipe", nome: "Equipe", icon: "fa-users" },
      { id: "servicos", nome: "Serviços", icon: "fa-scissors" },
      { id: "promocoes", nome: "Promoções", icon: "fa-tags" },
      { id: "clientes", nome: "Clientes", icon: "fa-user" },
      { id: "clientes-retorno", nome: "Retorno", icon: "fa-clock-rotate-left" },
      { id: "fila-inteligente", nome: "Fila inteligente", icon: "fa-users-line" },
      { id: "vitrine", nome: "Vitrine", icon: "fa-store" },
      { id: "pagamentos", nome: "Pagamentos", icon: "fa-credit-card" },
      { id: "planos", nome: "Planos", icon: "fa-file-invoice-dollar" },
      { id: "relatorios", nome: "Relatórios", icon: "fa-chart-line" },
      { id: "permissoes", nome: "Permissões", icon: "fa-sliders" },
      { id: "notificacoes", nome: "Notificações", icon: "fa-bell" },
      { id: "duvidas", nome: "Dúvidas frequentes", icon: "fa-circle-question" }
    ];

    function temConteudoPreenchido(dados) {
      return (
        (dados?.titulo && dados.titulo.trim()) ||
        (dados?.conteudo && dados.conteudo.trim()) ||
        (dados?.imagem && String(dados.imagem).trim())
      );
    }

    async function carregarConteudo(secaoId) {
      viewContainer.innerHTML = '<div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Buscando no manual...</div>';
      
      try {
        const docRef = doc(db, COLECAO_MANUAL, secaoId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const dados = docSnap.data();
          
          let html = `
            <span class="badge">${dados.nome || 'Manual'}</span>
            <h1>${dados.titulo || 'Sem título'}</h1>
            <div class="text-content">${dados.conteudo || 'Esta seção ainda não possui conteúdo explicativo.'}</div>
          `;

          if (dados.imagem) {
            html += `
              <div class="image-container" style="display: block;">
                <img src="${dados.imagem}" alt="Instrução visual">
              </div>
            `;
          }

          viewContainer.innerHTML = html;
        } else {
          viewContainer.innerHTML = `
            <div class="loading">
              Esta seção ainda não foi configurada no editor.
            </div>
          `;
        }
      } catch (error) {
        console.error("Erro ao carregar:", error);
        viewContainer.innerHTML = '<div class="loading">Erro ao carregar dados do Firebase.</div>';
      }
    }

    async function carregarMenuDisponivel() {
      navMenu.innerHTML = '<div class="loading">Carregando tópicos...</div>';

      try {
        navMenu.innerHTML = "";
        let primeiraSecao = null;
        let primeiroBotao = null;

        for (const secao of SECOES_MANUAL) {
          const docRef = doc(db, COLECAO_MANUAL, secao.id);
          const docSnap = await getDoc(docRef);

          if (!docSnap.exists()) continue;

          const dados = docSnap.data();

          if (!temConteudoPreenchido(dados)) continue;

          const botao = document.createElement("button");
          botao.className = "nav-item";
          botao.dataset.section = secao.id;
          botao.innerHTML = `
            <span><i class="fa-solid ${secao.icon}"></i></span>
            ${dados.nome || secao.nome}
          `;

          botao.addEventListener("click", () => {
            document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
            botao.classList.add("active");
            carregarConteudo(secao.id);
          });

          navMenu.appendChild(botao);

          if (!primeiraSecao) {
            primeiraSecao = secao.id;
            primeiroBotao = botao;
          }
        }

        if (primeiraSecao && primeiroBotao) {
          primeiroBotao.classList.add("active");
          carregarConteudo(primeiraSecao);
        } else {
          navMenu.innerHTML = "";
          viewContainer.innerHTML = `
            <div class="loading">
              Nenhuma seção do manual foi preenchida ainda.
            </div>
          `;
        }
      } catch (error) {
        console.error("Erro ao carregar menu:", error);
        navMenu.innerHTML = "";
        viewContainer.innerHTML = `
          <div class="loading">
            Erro ao carregar tópicos do manual.
          </div>
        `;
      }
    }

    carregarMenuDisponivel();
  </script>

</body>
</html>
