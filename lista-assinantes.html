<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes Assinantes - Pronti Pet</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:400,600,700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --pet-roxo: #5522b6;
            --pet-roxo-2: #7140dc;
            --pet-roxo-escuro: #201042;
            --pet-amarelo: #ffc928;
            --pet-fundo: #f8f5ff;
            --pet-card: #ffffff;
            --pet-borda: #e7def8;
            --pet-texto: #17113d;
            --pet-muted: #726b86;
            --pet-verde: #16a34a;
            --pet-vermelho: #dc2626;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            font-family: 'Poppins', sans-serif;
            color: var(--pet-texto);
            background:
                radial-gradient(circle at 90% 5%, rgba(255, 201, 40, .15), transparent 22rem),
                radial-gradient(circle at 15% 85%, rgba(113, 64, 220, .10), transparent 24rem),
                linear-gradient(180deg, #fbfaff 0%, var(--pet-fundo) 100%);
        }

        #menu-container {
            width: 250px;
            min-width: 250px;
            flex-shrink: 0;
        }

        main {
            flex-grow: 1;
            min-width: 0;
            min-height: 100vh;
            padding: 28px 30px 78px;
            margin-left: 0;
            background: transparent;
            display: flex;
            flex-direction: column;
        }

        .header-pagina {
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
            padding: 22px 24px;
            border: 1px solid var(--pet-borda);
            border-radius: 22px;
            background:
                radial-gradient(circle at 90% 20%, rgba(255,201,40,.18), transparent 10rem),
                linear-gradient(135deg, #ffffff 0%, #f8f3ff 100%);
            box-shadow: 0 16px 38px rgba(32,16,66,.08);
        }

        .header-pagina::after {
            content: "🐾";
            position: absolute;
            right: 22px;
            bottom: -22px;
            font-size: 5rem;
            opacity: .05;
            transform: rotate(-18deg);
            pointer-events: none;
        }

        .header-pagina h1 {
            position: relative;
            z-index: 1;
            margin: 0;
            color: var(--pet-roxo-escuro);
            font-size: clamp(1.55rem, 3vw, 2.2rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -.035em;
        }

        .header-botoes {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-header {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 15px;
            border: none;
            border-radius: 12px;
            font-size: .78rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(32,16,66,.10);
            transition: transform .18s ease, box-shadow .18s ease;
        }

        .btn-header:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(32,16,66,.16);
        }

        .btn-assinantes {
            background: linear-gradient(135deg, var(--pet-roxo), var(--pet-roxo-2));
            color: #fff;
        }

        .btn-dashboard {
            background: linear-gradient(135deg, #d99b00, var(--pet-amarelo));
            color: #2b1558;
        }

        .btn-novo {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #fff;
        }

        .espaco-cards {
            height: 2px;
        }

        #lista-clientes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
            margin-top: 0;
            padding: 20px;
            border: 1px solid var(--pet-borda);
            border-radius: 22px;
            background: rgba(255,255,255,.74);
            box-shadow: 0 14px 34px rgba(32,16,66,.055);
            backdrop-filter: blur(6px);
        }

        .card-cliente {
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 0;
            padding: 22px;
            border: 1px solid var(--pet-borda);
            border-top: 5px solid var(--pet-roxo);
            border-radius: 18px;
            background:
                radial-gradient(circle at 100% 0%, rgba(255,201,40,.10), transparent 9rem),
                linear-gradient(180deg, #ffffff 0%, #fbf9ff 100%);
            box-shadow: 0 10px 25px rgba(32,16,66,.065);
        }

        .card-cliente::after {
            content: "🐾";
            position: absolute;
            right: 14px;
            bottom: -8px;
            font-size: 3.6rem;
            opacity: .045;
            transform: rotate(-18deg);
            pointer-events: none;
        }

        .card-cliente .nome {
            position: relative;
            z-index: 1;
            margin-bottom: 2px;
            color: var(--pet-roxo-escuro);
            font-size: 1.12rem;
            font-weight: 700;
        }

        .card-cliente .email {
            position: relative;
            z-index: 1;
            margin-bottom: 6px;
            color: var(--pet-muted);
            font-size: .8rem;
            font-weight: 400;
        }

        .assinatura-info {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .badge-ativo {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            background: #ecfdf3;
            color: #166534;
            font-size: .65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .04em;
            box-shadow: none;
        }

        .plano {
            color: var(--pet-roxo);
            font-size: .82rem;
            font-weight: 700;
        }

        .vence {
            position: relative;
            z-index: 1;
            margin-top: 2px;
            color: #5f5872;
            font-size: .78rem;
        }

        .pagamento-info {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 4px;
            padding: 11px 12px;
            border: 1px solid #eee7fa;
            border-radius: 12px;
            background: #f8f4ff;
            color: #4c455f;
            font-size: .76rem;
            line-height: 1.45;
            box-shadow: none;
        }

        .pagamento-info span {
            margin: 0;
        }

        .pagamento-info strong {
            margin-right: 4px;
            color: var(--pet-roxo);
            font-weight: 700;
        }

        .erro,
        .error-message {
            grid-column: 1 / -1;
            margin: 0;
            padding: 15px;
            border: 1px solid #fecaca;
            border-radius: 12px;
            background: #fef2f2;
            color: #b91c1c;
            font-weight: 700;
        }

        .info {
            grid-column: 1 / -1;
            margin: 0;
            padding: 28px;
            color: var(--pet-muted);
            font-weight: 700;
            text-align: center;
        }

        .card-plano-vazio {
            grid-column: 1 / -1;
            width: min(100%, 460px);
            min-height: 300px;
            margin: 14px auto;
            padding: 32px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--pet-borda);
            border-top: 5px solid var(--pet-amarelo);
            border-radius: 22px;
            background:
                radial-gradient(circle at 50% 0%, rgba(255,201,40,.14), transparent 11rem),
                #fff;
            text-align: center;
            box-shadow: 0 14px 34px rgba(32,16,66,.08);
        }

        .card-vazio-content i {
            display: block;
            margin-bottom: 16px;
            color: var(--pet-amarelo);
            font-size: 2.7rem;
        }

        .card-vazio-content h2 {
            margin: 0 0 10px;
            color: var(--pet-roxo-escuro);
            font-size: 1.2rem;
        }

        .card-vazio-content p {
            margin: 0;
            color: var(--pet-muted);
            font-size: .86rem;
            line-height: 1.55;
        }

        @media (max-width: 992px) {
            #menu-container {
                display: none;
            }

            main {
                margin-left: 0;
                padding: 20px;
            }
        }

        @media (max-width: 768px) {
            main {
                padding: 70px 14px 70px;
            }

            .header-pagina {
                align-items: flex-start;
                flex-direction: column;
                padding: 18px;
                border-radius: 18px;
            }

            .header-pagina h1 {
                font-size: 1.35rem;
            }

            .header-botoes {
                width: 100%;
                display: grid;
                grid-template-columns: 1fr;
            }

            .btn-header {
                width: 100%;
                min-height: 40px;
                padding: 9px 12px;
                font-size: .72rem;
            }

            #lista-clientes {
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 14px;
                border-radius: 18px;
            }

            .card-cliente {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <aside id="menu-container"></aside>
    <main>
        <div class="header-pagina">
            <h1>Clientes Assinantes</h1>
            <div class="header-botoes">
                <a href="lista-assinantes.html" class="btn-header btn-assinantes"><i class="fa-solid fa-crown"></i> Clientes Assinantes</a>
                <a href="dashboard-pagamentos.html" class="btn-header btn-dashboard"><i class="fa-solid fa-check-to-slot"></i> Painel de Aprovações</a>
                <a href="planos.html" class="btn-header btn-novo"><i class="fa-solid fa-plus"></i> Meus Planos</a>
            </div>
        </div>
        <div class="espaco-cards"></div>
        <div id="lista-clientes">
            <p class="info">Carregando assinantes...</p>
        </div>
    </main>

    <script type="module">
        import { db, auth } from './vitrini-firebase.js'; 
        import { collection, query, where, getDocs, getDoc, doc } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';

        const listaClientesDiv = document.getElementById('lista-clientes');

        async function carregarMenu() {
            try {
                const response = await fetch('menu-lateral.html');
                document.getElementById('menu-container').innerHTML = await response.text();
                const menuModule = await import('./menu-lateral.js');
                if (menuModule.ativarMenuLateral) menuModule.ativarMenuLateral(['dono']);
            } catch (error) {
                // ignora erro de menu
            }
        }
        carregarMenu();

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                listaClientesDiv.innerHTML = '<p class="erro">Você precisa estar logado para ver esta página.</p>';
                return;
            }
            const empresaAtivaId = localStorage.getItem("empresaAtivaId");
            if (empresaAtivaId) {
                carregarAssinantesAtivos(empresaAtivaId);
            } else {
                listaClientesDiv.innerHTML = '<p class="erro">Nenhuma empresa ativa selecionada.</p>';
            }
        });

        async function buscarPagamentoDoCliente(clienteId) {
            const pagamentosRef = collection(db, 'pagamentosPendentes');
            const pagamentosQ = query(pagamentosRef, where('clienteId', '==', clienteId), where('status', '==', 'aprovado'));
            const pagamentosSnap = await getDocs(pagamentosQ);
            if (pagamentosSnap.empty) return null;
            let pagamento = pagamentosSnap.docs[0].data();
            pagamentosSnap.docs.forEach(doc => {
                const docData = doc.data();
                if (docData.dataCriacao && (!pagamento.dataCriacao || docData.dataCriacao.seconds > pagamento.dataCriacao.seconds)) {
                    pagamento = docData;
                }
            });
            return pagamento;
        }

        async function carregarAssinantesAtivos(empresaId) {
            try {
                const clientesRef = collection(db, `empresarios/${empresaId}/clientes`);
                const clientesSnapshot = await getDocs(clientesRef);
                if (clientesSnapshot.empty) {
                    listaClientesDiv.innerHTML = `
                        <div class="card-plano-vazio">
                            <div class="card-vazio-content">
                                <i class="fa-solid fa-user"></i>
                                <h2>Sem assinantes ainda!</h2>
                                <p>Assim que houver clientes assinantes, eles aparecerão aqui.</p>
                            </div>
                        </div>
                    `;
                    return;
                }
                const promises = clientesSnapshot.docs.map(async (clienteDoc) => {
                    const cliente = { id: clienteDoc.id, ...clienteDoc.data() };
                    // Busca assinatura ativa
                    const assinaturasRef = collection(db, `empresarios/${empresaId}/clientes/${cliente.id}/assinaturas`);
                    const q = query(assinaturasRef, where('status', '==', 'ativo'));
                    const assinaturaSnapshot = await getDocs(q);

                    let assinaturaAtiva = null;
                    if (!assinaturaSnapshot.empty) {
                        const docAtivo = assinaturaSnapshot.docs.find(doc => {
                            const dataFim = doc.data().dataFim;
                            return dataFim && dataFim.toDate() > new Date();
                        });
                        if (docAtivo) assinaturaAtiva = docAtivo.data();
                    }

                    // Busca e-mail do usuário
                    let emailUsuario = null;
                    try {
                        const usuarioRef = doc(db, 'usuarios', cliente.id);
                        const usuarioSnap = await getDoc(usuarioRef);
                        if (usuarioSnap.exists()) emailUsuario = usuarioSnap.data().email;
                    } catch (e) {}

                    // Busca pagamento aprovado
                    let pagamentoInfo = null;
                    try {
                        pagamentoInfo = await buscarPagamentoDoCliente(cliente.id);
                    } catch (e) {}

                    return { ...cliente, assinatura: assinaturaAtiva, emailUsuario, pagamentoInfo };
                });

                const clientesComAssinatura = await Promise.all(promises);
                const assinantesAtivos = clientesComAssinatura.filter(c => c.assinatura !== null);

                if (assinantesAtivos.length === 0) {
                    listaClientesDiv.innerHTML = `
                        <div class="card-plano-vazio">
                            <div class="card-vazio-content">
                                <i class="fa-solid fa-user"></i>
                                <h2>Sem assinantes ainda!</h2>
                                <p>Assim que houver clientes assinantes, eles aparecerão aqui.</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                listaClientesDiv.innerHTML = '';
                assinantesAtivos.forEach(cliente => {
                    const dataFim = cliente.assinatura.dataFim.toDate().toLocaleDateString('pt-BR');
                    const pagamento = cliente.pagamentoInfo;
                    let pagamentoHtml = '';
                    if (pagamento) {
                        const valorFormatado = pagamento.valor ? `R$ ${Number(pagamento.valor).toFixed(2)}` : '';
                        pagamentoHtml = `
                            <div class="pagamento-info">
                                <span><strong>Pagamento:</strong> ${pagamento.metodo ? pagamento.metodo.toUpperCase() : '---'} ${valorFormatado}</span>
                                <span><strong>Status:</strong> ${pagamento.status || '---'}</span>
                                <span><strong>Plano:</strong> ${pagamento.planoNome || '---'}</span>
                                <span><strong>Data:</strong> ${pagamento.dataCriacao && pagamento.dataCriacao.toDate ? pagamento.dataCriacao.toDate().toLocaleDateString('pt-BR') : '---'}</span>
                            </div>
                        `;
                    }
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'card-cliente';
                    cardDiv.innerHTML = `
                        <span class="nome">${cliente.nome}</span>
                        <span class="email">${cliente.emailUsuario || 'E-mail não informado'}</span>
                        <div class="assinatura-info">
                            <span class="badge-ativo">ASSINANTE ATIVO</span>
                            <span class="plano">${cliente.assinatura.planoNome}</span>
                        </div>
                        <span class="vence">Vence em: ${dataFim}</span>
                        ${pagamentoHtml}
                    `;
                    listaClientesDiv.appendChild(cardDiv);
                });

            } catch (error) {
                listaClientesDiv.innerHTML = '<p class="error-message">Ocorreu um erro ao carregar os assinantes.</p>';
            }
        }
    </script>
</body>
</html>
