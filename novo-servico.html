<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Serviço - Pronti Pet</title>

  <link rel="stylesheet" href="style.css?v=pet-final">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --primary: #4f46e5;
      --gradient-primary: linear-gradient(135deg, #4f46e5 0%, #6366f1 45%, #8b5cf6 100%);
      --sidebar-width: 240px;
    }

    * {
      box-sizing: border-box;
    }

    body.novo-servico-body {
      margin: 0;
      background: var(--gradient-primary);
      font-family: 'Inter', sans-serif;
      color: #1e293b;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body.novo-servico-body:not(.loaded) .main-content {
      opacity: 0;
      visibility: hidden;
    }

    body.novo-servico-body.loaded .main-content {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.25s ease;
    }

    #page-loader {
      position: fixed;
      inset: 0;
      background: var(--gradient-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      color: white;
      font-size: 1.1rem;
      font-weight: 800;
    }

    body.loaded #page-loader {
      display: none;
    }

    #menu-container {
      position: relative;
      z-index: 20;
    }

    .main-content {
      margin-left: var(--sidebar-width);
      padding: 28px;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      width: auto;
      background: transparent;
    }

    .form-card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 20px;
      padding: 26px;
      width: 100%;
      max-width: 920px;
      box-shadow: 0 12px 36px rgba(15, 23, 42, 0.24);
      border: 1px solid rgba(255,255,255,0.55);
      overflow: hidden;
    }

    .page-title {
      text-align: center;
      margin-bottom: 22px;
    }

    .page-title .icon {
      width: 54px;
      height: 54px;
      border-radius: 17px;
      background: var(--gradient-primary);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      box-shadow: 0 8px 22px rgba(79,70,229,0.28);
      margin-bottom: 10px;
    }

    .page-title h1 {
      font-size: 1.9rem;
      font-weight: 900;
      color: #1e1b4b;
      margin: 0;
    }

    .page-title p {
      color: #64748b;
      margin: 7px auto 0;
      font-weight: 500;
      max-width: 620px;
      line-height: 1.35;
    }

    .form-group {
      margin-bottom: 12px;
      width: 100%;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .form-group label {
      font-size: 0.9rem;
      font-weight: 800;
      margin-bottom: 5px;
      color: #1e1b4b;
      line-height: 1.2;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      padding: 11px 12px;
      border: 1.5px solid #c7d2fe;
      background: #ffffff;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      color: #1e293b;
      font-family: 'Inter', sans-serif;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .form-group textarea {
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--primary);
      background: #f8faff;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn-submit,
    .btn-delete {
      color: #fff;
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 0;
    }

    .btn-submit {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      flex: 1;
      box-shadow: 0 8px 20px rgba(99,102,241,0.25);
    }

    .btn-delete {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      display: none;
      box-shadow: 0 8px 20px rgba(220,38,38,0.22);
    }

    /* CORREÇÃO FORTE PARA OS CAMPOS GERADOS PELO novo-servico.js */
    #campos-dinamicos,
    #campos-dinamicos * {
      box-sizing: border-box;
    }

    #campos-dinamicos {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    #campos-dinamicos .pet-section {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      padding: 14px !important;
      margin-bottom: 14px !important;
      border-radius: 14px !important;
    }

    #campos-dinamicos .pet-section h3 {
      font-size: 1rem !important;
      margin-bottom: 10px !important;
      line-height: 1.25;
    }

    #campos-dinamicos .pet-grid,
    #campos-dinamicos .pet-grid-3 {
      width: 100%;
      max-width: 100%;
      gap: 10px !important;
    }

    #campos-dinamicos .pet-porte-card {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
      padding: 12px !important;
      border-radius: 12px !important;
    }

    #campos-dinamicos .pet-porte-card h4 {
      margin-bottom: 9px !important;
      font-size: 0.95rem !important;
    }

    #campos-dinamicos .modo-calculo {
      gap: 10px !important;
    }

    #campos-dinamicos .modo-calculo label {
      min-width: 0;
      max-width: 100%;
      padding: 9px 10px !important;
      font-size: 0.9rem;
    }

    #campos-dinamicos .help-text {
      font-size: 0.8rem !important;
      line-height: 1.3 !important;
      margin-top: 4px !important;
    }

    #campos-dinamicos input,
    #campos-dinamicos textarea,
    #campos-dinamicos select {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
    }

    #campos-dinamicos input[type="number"] {
      appearance: textfield;
    }

    #percentual-medio,
    #percentual-grande,
    #percentual-gigante {
      max-width: 100% !important;
    }

    @media (max-width: 900px) {
      .main-content {
        margin-left: 0;
        padding: 12px;
        padding-top: 72px;
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }

      .form-card {
        padding: 14px;
        border-radius: 16px;
        width: 100%;
        max-width: 100%;
      }

      .page-title {
        margin-bottom: 16px;
      }

      .page-title .icon {
        width: 48px;
        height: 48px;
        font-size: 1.45rem;
        border-radius: 15px;
        margin-bottom: 8px;
      }

      .page-title h1 {
        font-size: 1.45rem;
      }

      .page-title p {
        font-size: 0.88rem;
      }

      .form-group {
        margin-bottom: 10px;
      }

      .form-group label {
        font-size: 0.84rem;
      }

      .form-group input,
      .form-group textarea,
      .form-group select {
        padding: 10px;
        font-size: 0.9rem;
        border-radius: 9px;
      }

      #campos-dinamicos .pet-grid,
      #campos-dinamicos .pet-grid-3 {
        display: grid !important;
        grid-template-columns: 1fr !important;
        gap: 9px !important;
      }

      #campos-dinamicos .pet-section {
        padding: 12px !important;
        margin-bottom: 12px !important;
      }

      #campos-dinamicos .pet-porte-card {
        padding: 10px !important;
      }

      #campos-dinamicos .modo-calculo {
        flex-direction: column !important;
      }

      #campos-dinamicos .modo-calculo label {
        width: 100% !important;
      }

      #campos-dinamicos .check-row {
        font-size: 0.88rem !important;
        align-items: flex-start !important;
      }

      #campos-dinamicos .preview-servico {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        max-height: 180px !important;
      }

      .actions {
        flex-direction: column;
        gap: 10px;
      }

      .btn-submit,
      .btn-delete {
        width: 100%;
        padding: 13px 16px;
        font-size: 0.96rem;
      }
    }

    @media (max-width: 430px) {
      .main-content {
        padding-left: 8px;
        padding-right: 8px;
        padding-top: 68px;
      }

      .form-card {
        padding: 10px;
        border-radius: 14px;
      }

      #campos-dinamicos .pet-section {
        padding: 10px !important;
      }

      #campos-dinamicos .pet-porte-card {
        padding: 9px !important;
      }

      .form-group input,
      .form-group textarea,
      .form-group select {
        font-size: 0.88rem;
        padding: 9px;
      }
    }
  </style>
</head>

<body class="novo-servico-body">
  <div id="page-loader">Carregando serviço...</div>

  <div id="menu-container"></div>

  <main class="main-content">
    <div class="form-card">
      <div class="page-title">
        <div class="icon">
          <i class="fa-solid fa-paw"></i>
        </div>
        <h1>Novo Serviço</h1>
        <p>Cadastre serviços, categorias, preços por porte e foto para a vitrine.</p>
      </div>

      <form id="form-servico">
        <div id="campos-dinamicos"></div>

        <div class="actions">
          <button type="submit" class="btn-submit">
            <i class="fa-solid fa-floppy-disk"></i>
            Salvar Serviço
          </button>

          <button type="button" id="btn-excluir-servico" class="btn-delete">
            <i class="fa-solid fa-trash"></i>
            Excluir Serviço
          </button>
        </div>
      </form>
    </div>
  </main>

  <script type="module">
    import { verificarAcesso } from './userService.js';

    async function carregarMenuEPagina() {
      try {
        const sessao = await verificarAcesso();

        if (!sessao || !sessao.user) {
          document.body.classList.add('loaded');
          return;
        }

        let papelUsuario = sessao.papeis || [];

        if (papelUsuario.length === 0) {
          if (sessao.isAdmin) papelUsuario.push('admin');
          if (sessao.isOwner) papelUsuario.push('dono');
          if (papelUsuario.length === 0) papelUsuario.push('funcionario');
        }

        const response = await fetch('menu-lateral.html');

        if (!response.ok) {
          throw new Error('menu-lateral.html não encontrado');
        }

        document.getElementById('menu-container').innerHTML = await response.text();

        const menuModule = await import('./menu-lateral.js');

        if (menuModule.ativarMenuLateral) {
          await menuModule.ativarMenuLateral(papelUsuario);
        }

        try {
          await import('./novo-servico.js');
        } catch (erroJs) {
          console.error("Erro ao carregar novo-servico.js:", erroJs);
        }

        document.body.classList.add('loaded');

      } catch (error) {
        console.error("Erro crítico ao inicializar novo-servico.html:", error);

        document.querySelector('.form-card').innerHTML = `
          <h1>Ocorreu um erro</h1>
          <p>Não foi possível carregar a página. Tente novamente.</p>
        `;

        document.body.classList.add('loaded');
      }
    }

    carregarMenuEPagina();
  </script>
</body>
</html>
