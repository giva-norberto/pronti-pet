<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Administração | Prospecção Pronti Pet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { --roxo:#5522b6; --azul:#2563eb; --cinza:#6b7280; --borda:#e5e7eb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,sans-serif; background:#f6f6fa; color:#111827; }
    .main { max-width:1200px; margin:0 auto; padding:28px 20px 48px; }
    .topo { display:flex; justify-content:space-between; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:24px; }
    h1 { margin:0; font-size:1.75rem; }
    .sub { color:var(--cinza); margin-top:6px; }
    .acoes { display:flex; gap:10px; flex-wrap:wrap; }
    .btn { display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:8px; padding:10px 16px; text-decoration:none; font-weight:700; cursor:pointer; }
    .btn-voltar { background:var(--roxo); color:#fff; }
    .btn-gerar { background:var(--azul); color:#fff; }
    .btn-gerar[disabled] { opacity:.55; cursor:not-allowed; }
    .metricas { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:20px; }
    .card { background:#fff; border:1px solid var(--borda); border-radius:12px; padding:16px; box-shadow:0 2px 10px rgba(15,23,42,.04); }
    .numero { font-size:1.7rem; font-weight:800; margin-top:5px; }
    .label { color:var(--cinza); font-size:.9rem; }
    .painel { background:#fff; border:1px solid var(--borda); border-radius:12px; padding:18px; }
    .filtros { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .filtros input,.filtros select { padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; background:#fff; }
    table { width:100%; border-collapse:collapse; }
    th,td { text-align:left; padding:12px 10px; border-bottom:1px solid #eef0f3; font-size:.92rem; }
    th { color:#4b5563; background:#f9fafb; }
    .vazio { text-align:center; color:var(--cinza); padding:38px 10px; }
    .badge { display:inline-flex; padding:4px 9px; border-radius:999px; background:#eef2ff; color:#3730a3; font-weight:700; font-size:.8rem; }
    @media(max-width:800px){ .metricas{grid-template-columns:repeat(2,1fr)} .painel{overflow:auto} }
  </style>
</head>
<body>
  <main class="main">
    <header class="topo">
      <div>
        <h1>Prospecção Pronti Pet</h1>
        <div class="sub">Leads, demos personalizadas e acompanhamento comercial.</div>
      </div>
      <div class="acoes">
        <a class="btn btn-voltar" href="admin-clientes.html">← Administração</a>
        <button class="btn btn-gerar" id="gerarLeads" disabled title="Será habilitado quando a integração com Google Places estiver configurada">Gerar leads</button>
      </div>
    </header>

    <section class="metricas">
      <div class="card"><div class="label">Novos</div><div class="numero" id="mNovos">0</div></div>
      <div class="card"><div class="label">Demos prontas</div><div class="numero" id="mDemos">0</div></div>
      <div class="card"><div class="label">Abriram</div><div class="numero" id="mAbertos">0</div></div>
      <div class="card"><div class="label">Interessados</div><div class="numero" id="mInteressados">0</div></div>
    </section>

    <section class="painel">
      <div class="filtros">
        <select id="statusFiltro">
          <option value="">Todos os status</option>
          <option value="novo">Novo</option>
          <option value="demo_pronta">Demo pronta</option>
          <option value="enviado">Enviado</option>
          <option value="abriu">Abriu demo</option>
          <option value="interessado">Interessado</option>
          <option value="cliente">Cliente</option>
          <option value="descartado">Descartado</option>
        </select>
        <input id="busca" type="search" placeholder="Buscar pet shop...">
      </div>
      <table>
        <thead><tr><th>Pet shop</th><th>Nota</th><th>Avaliações</th><th>Status</th><th>Demo</th><th>Ação</th></tr></thead>
        <tbody id="listaLeads">
          <tr><td colspan="6" class="vazio">Nenhum lead gerado ainda. A estrutura da prospecção já está dentro de Administração.</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

    const ADMIN_UID = "HNIJxFjPvSO1oO9X1Gjq7negfR12";

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      if (user.uid !== ADMIN_UID) {
        document.body.innerHTML = '<div style="padding:40px;font-family:Arial">Acesso restrito. Apenas administradores.</div>';
      }
    });
  </script>
</body>
</html>
